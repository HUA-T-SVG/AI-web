- id: psychology-item-direction-key
  标题: 反向题需按题号与计分键处理
  类别: 数据标准
  适用学科: 心理学
  适用字段:
  - 题号
  - 作答值
  - 反向题
  - item
  触发条件: 量表含方向不同的题项，或不同版本题序有变化
  规则内容: |-
    先核对量表版本、题号、合法端点与反向计分键，再处理明确指定的题项。线性反向在适用时可用上下端点之和减原分；缺失或拒答码不参与该公式。不能仅凭否定词或题号位置判断，保留原分和转换记录。
  正例: 自拟1至5等距编码题，计分键指定反向且作答2 → 转为1+5-2=4
  反例: 0至4题的反向方式不能直接照搬1至5；量表改版后原题号也可能不再对应
  来源: |-
    HBCD研究原始数据文档：PSS-4题目方向与计分说明（仅作方法例证）
    https://docs.hbcdstudy.org/latest/instruments/SED/promis/
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: psychology-scale-missing-score
  标题: 量表缺题时能否评分由手册决定
  类别: 口径规则
  适用学科: 心理学
  适用字段:
  - 量表版本
  - 作答题数
  - 总分
  - T分数
  触发条件: 题项有缺失但仍打算生成总分或标准分
  规则内容: |-
    按当前量表、短表版本与评分方法确认最少作答数及缺失处理。原始分查表、响应模式评分和按比例推算不能默认等价；不能自动用受试者均值或全样本均值补题。记录未能评分原因，保留题级缺失。
  正例: 手册要求完整作答才能查表时，缺题记录不直接进入该查表流程
  反例: 软件能输出分数不证明该分数满足本量表的作答要求；不可套统一“答满一半即可”
  来源: |-
    HealthMeasures：Calculate Scores，人工计分与有缺失时的评分方式
    https://healthmeasures.net/implement/scoring/calculate-scores/
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: psychology-alpha-not-dimensionality
  标题: 内部一致性不能替代维度与效度检查
  类别: 口径规则
  适用学科: 心理学
  适用字段:
  - 题项
  - 分量表
  - alpha
  - omega
  触发条件: 仅凭Cronbach alpha较高就宣布量表有效或直接合并所有题项
  规则内容: |-
    内部一致性、结构效度和其他效度不是同一属性。应先核对题项所属维度、样本和计分结构，再解释各维度的可靠性估计；不能把总量表的一个系数替代所有分量表证据，也不通过删除题项只为提高系数。
  正例: 按已声明维度分别检查计分结构与内部一致性，并记录样本和估计方法
  反例: alpha高不证明单维，也不证明量表测到了目标心理构念
  来源: |-
    COSMIN Manual v2.0，2024年8月，内部一致性、结构效度及测量不变性
    https://www.cosmin.nl/wp-content/uploads/COSMIN-manual-V2_final.pdf
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: psychology-language-group-comparability
  标题: 跨群体量表均值比较需核对测量可比性
  类别: 口径规则
  适用学科: 心理学
  适用字段:
  - 语言版本
  - 群体
  - 题项
  - 总分
  触发条件: 比较不同语言、年龄或文化群体的同名量表分数
  规则内容: |-
    同名、同题数或同取值范围不保证测量相同构念。需记录翻译版本、施测方式及相应跨文化效度或测量不变性证据，检查题项差异功能；资料不足时说明可比性限制，不把分数差直接解释为真实心理差异。
  正例: 对照适用研究中的群体可比性证据后，再决定如何比较分数
  反例: 两份译本都按1至5评分，不意味着可以无条件合并或比较均值
  来源: |-
    COSMIN Manual v2.0，2024年8月，内部一致性、结构效度及测量不变性
    https://www.cosmin.nl/wp-content/uploads/COSMIN-manual-V2_final.pdf
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: psychology-straightlining-review
  标题: 连续同选项只是作答质量核查线索
  类别: 清洗案例
  适用学科: 心理学
  适用字段:
  - 题项序列
  - 答题时长
  - 注意力题
  触发条件: 受试者在一组题中连续选择同一选项
  规则内容: |-
    连续同选项可能是真实一致态度，也可能是低投入作答。结合题目方向、题组设计、时长和预先声明的质量指标复核；记录证据及排除规则，比较排除前后结果。不能单凭这一模式自动删掉整名受试者。
  正例: 同选模式被列为候选，随后按预先定义规则及其他证据人工核对
  反例: 题目含义相近且真实态度一致时，同选可能有效；同选不等于造假
  来源: |-
    Reuning与Plutzer，2020，Valid vs. Invalid Straightlining，原始研究
    https://ojs.ub.uni-konstanz.de/srm/article/view/7641
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
