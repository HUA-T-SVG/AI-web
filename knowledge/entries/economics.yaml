- id: economics-exchange-rate-quotation
  标题: 币种换算需核对报价方向与时点
  类别: 数据标准
  适用学科: 经济学
  适用字段:
  - 金额
  - 原币种
  - 目标币种
  - 汇率
  触发条件: 把不同币种金额合并，或汇率乘除方向不明确
  规则内容: |-
    记录原币、目标币及每一单位基准币对应多少报价币，核对日期、日/月平均、买卖/参考用途和金额计量单位。参考汇率不等于实际交易结算价；不能只因列名写“汇率”就决定乘还是除。
  正例: 自拟1A=2B，10A按该报价换算为20B，同时保留原币和报价时点
  反例: 不能把B/A报价直接当A/B，也不能把参考价冒充含费用的实际结算价
  来源: |-
    ECB：Euro foreign exchange reference rates，报价方向与参考用途（不引用具体日价格）
    https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: economics-chain-volume-nonadditive
  标题: 链式实际量分项通常不能直接相加
  类别: 口径规则
  适用学科: 经济学
  适用字段:
  - 实际GDP
  - 链式量
  - 分项
  - 参考年
  触发条件: 实际量分项之和不等于公布的链式总量
  规则内容: |-
    先区分当期价格金额、固定基期实际量和链式量指标。链式量的加总特性与普通金额不同，分项差额不一定是漏项或算错；使用发布方给出的贡献或聚合方法，记录参考期与版本，不为凑总额调整分项。
  正例: 确认是链式量后查发布方的非可加性说明与贡献分解
  反例: 不能将名义金额的加总规则直接套给链式实际量；也不能由此忽略真实定义不一致
  来源: |-
    BEA：Chained-Dollar Indexes，链式量指标的使用与加总问题（方法参考）
    https://www.bea.gov/resources/methodologies/chained-dollar-indexes
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: economics-index-level-rebasing
  标题: 指数水平不是当期涨幅，换基须一致
  类别: 口径规则
  适用学科: 经济学
  适用字段:
  - 价格指数
  - 基期
  - CPI
  - index
  触发条件: 把指数110写成当期上涨10%，或直接拼接不同基期指数
  规则内容: |-
    指数水平需结合参考基期解释，当期变化应比较相应两期比值。仅作比例换基时，变动率应保持一致；权重、覆盖或方法修订则不只是换基。保留原序列、基期和转换关系，不把指数点差自动当百分点变化。
  正例: 同一序列100到110，两期涨幅10%；若110到121仍是10%
  反例: |-
    某月指数110并不单独说明它比上月涨10%，不同地区指数水平也不自动表示价格高低
  来源: |-
    美国劳工统计局BLS：Rebasing an index，换基与增长率
    https://www.bls.gov/cpi/factsheets/rebasing.htm
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: economics-seasonally-adjusted-series
  标题: 季调与未季调序列不可无说明混用
  类别: 口径规则
  适用学科: 经济学
  适用字段:
  - 季调标记
  - 月份
  - 指标
  - SA
  - NSA
  触发条件: 跨来源比较增长率，或同一列混入季调与原始值
  规则内容: |-
    核对是否季调、调整范围、方法及发布版本。季调旨在处理可估计的季节和日历影响，不等于真实原始总量；原序列和季调序列的月间方向可以不同，修订因子还可能改变历史值。比较与回测应保留当时版本。
  正例: 同一指标比较时明确使用同口径季调序列，并标记版本
  反例: 原值上升而季调值下降不自动说明数据错误，不能任意挑选有利方向
  来源: |-
    美国人口普查局：Seasonal Adjustment Questions and Answers，季调序列
    https://www.census.gov/data/software/x13as/seasonal-adjustment-questions-answers.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: economics-cumulative-quarter-flow
  标题: 累计值与单季值须按期间起止识别
  类别: 清洗案例
  适用学科: 经济学
  适用字段:
  - 报告期
  - 累计收入
  - 单季收入
  - start
  - end
  触发条件: 季度报表混有年初累计、单季流量和时点余额
  规则内容: |-
    核对每个值的起止日期、指标、单位、主体和修订版次，再决定是否可差分。仅在同口径累计覆盖相接时，后一期累计减前一期累计才能得到中间期流量；时点余额、不同合并范围或不同修订版不能机械相减。
  正例: 自拟同口径一季度累计100、上半年累计170 → 二季度流量70
  反例: 不能把季末资产余额170减上季100后称为当季收入，也不能只看Q2标签判定单季
  来源: |-
    美国SEC：EDGAR APIs，财务期间与日历框架（方法参考）
    https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
