- id: sociology-household-person-denominator
  标题: 户与个人是不同的统计单位
  类别: 数据标准
  适用学科: 社会学
  适用字段:
  - 家庭ID
  - 个人ID
  - 成员数
  - 户收入
  触发条件: 把家庭表展开到个人后，仍直接按行求家庭指标
  规则内容: |-
    先区分户、家庭、个人及居住单位的定义，保留户键和成员键。户级数值复制到成员行不代表多份独立家庭；户数、人均值与家庭总量要按各自分母和权重计算。不同调查对共同居住和家庭关系的界定可能不同。
  正例: 一户4名成员，户收入复制4行 → 仍只是一份户收入和一户
  反例: 相同地址不一定同一家庭；不能按成员行数直接当户数
  来源: |-
    美国人口普查局：Household与Family定义（说明单位差异，不代替本地调查定义）
    https://www.census.gov/help/topics/faq.how-does-the-us-census-bureau-define-a-household-and-a-family.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: sociology-labour-status-reference-period
  标题: 劳动状态分类需明确参考期与人群
  类别: 口径规则
  适用学科: 社会学
  适用字段:
  - 就业状态
  - 求职
  - 可工作
  - 参考周
  触发条件: 把“没有工作”全部记成失业，或各来源参考期不同
  规则内容: |-
    就业、失业和非劳动力分类要对照所用统计标准、年龄范围、参考期及求职/可工作条件。不能只凭是否领工资或登记求职判断；保留原问题与派生过程，跨来源比较前核对版本和适用范围。
  正例: 先按该调查明确的状态派生规则分类，再计算相应劳动力分母
  反例: 未工作但未满足失业分类条件的人不能自动算失业；登记人数也不等于全部失业人数
  来源: |-
    ILOSTAT：Labour Force Statistics，统计定义与参考期
    https://ilostat.ilo.org/methods/concepts-and-definitions/description-labour-force-statistics/
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: sociology-frame-response-distinction
  标题: 覆盖不足与无应答是不同误差来源
  类别: 口径规则
  适用学科: 社会学
  适用字段:
  - 抽样框
  - 受邀名单
  - 响应状态
  - 总体
  触发条件: 用回收率高来证明调查覆盖完整或样本代表总体
  规则内容: |-
    区分目标总体、抽样框、被抽中者和响应者。框外人群不会因提高回收率自动出现；响应者与未响应者差异也不能仅由回收比例判断。报告覆盖范围、选择方式、无应答与调整方法，不以样本量替代这些信息。
  正例: 记录某平台用户样本的覆盖限制，即使平台内回收率很高也不外推全体居民
  反例: 低回收率不自动证明每项指标有严重偏差，高回收率也不保证无偏
  来源: |-
    Pew Research Center：U.S. Survey Methodology，总调查误差及资料记录
    https://www.pewresearch.org/u-s-survey-methodology/
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: sociology-intercoder-codebook
  标题: 人工编码需保留码本与编码者一致性
  类别: 口径规则
  适用学科: 社会学
  适用字段:
  - 原文
  - 编码
  - 编码者
  - 码本版本
  触发条件: 访谈或开放题由多名人员编码，准备合并类别结果
  规则内容: |-
    保留原文片段、编码单位、码本版本和原始独立编码，再记录分歧与裁决。原始一致率与考虑偶然一致的指标含义不同；Cohen kappa适用双编码者分类场景，不能当所有任务的统一质量分或用固定阈值自动通过。
  正例: 对同一批编码单元按同一码本独立编码，报告分歧和适用的一致性指标
  反例: 先协商成完全相同标签后再报独立编码一致率，会隐藏原始分歧
  来源: |-
    scikit-learn官方文档：cohen_kappa_score，编码者一致性
    https://scikit-learn.org/stable/modules/generated/sklearn.metrics.cohen_kappa_score.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: sociology-survey-mode-comparison
  标题: 调查方式变化可能改变回答分布
  类别: 清洗案例
  适用学科: 社会学
  适用字段:
  - 访问方式
  - 波次
  - 问卷版本
  - mode
  触发条件: 由访员电话改成自填网页后，敏感题或态度题结果跳变
  规则内容: |-
    记录访问模式、问卷措辞、选项呈现及样本组成。模式变化可能影响回答，但时间趋势变化也可能是真实社会变化；需利用设计资料、对照或桥接实验评估，不能为让曲线连续而自动校正答案。
  正例: 在两种模式的对照设计中评估差异，再说明跨期可比性限制
  反例: 仅观察到一次跳变不能证明全由模式造成，也不能随意改写历史取值
  来源: |-
    Pew Research Center，2015：电话与网页调查模式的随机实验
    https://www.pewresearch.org/methods/2015/05/13/from-telephone-to-the-web-the-challenge-of-mode-of-interview-effects-in-public-opinion-polls/
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
