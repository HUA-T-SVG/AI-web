- id: public-health-surveillance-case-definition
  标题: 监测病例需记录定义与分类版本
  类别: 数据标准
  适用学科: 公共卫生
  适用字段:
  - 病例分类
  - 报告时间
  - 确证时间
  - case_status
  触发条件: 混合疑似、可能、确诊记录，或不同阶段采用不同病例定义
  规则内容: |-
    先记录适用的监测病例定义、证据类型和生效时段，区分报告、发病和确证日期。定义变化可能造成表面趋势跳变，需保留分类迁移与旧版记录；不能把筛查或登记记录自动当作临床确诊。
  正例: 按同一监测定义统计，并说明定义变更时点及受影响范围
  反例: 为提高“确诊率”而把未核实记录归为确诊，或把监测定义当个人诊断依据，均不适用
  来源: |-
    CDC：Principles of Epidemiology，第1课第5节，病例定义
    https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson1/section5.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: public-health-censoring-event-indicator
  标题: 随访终止需区分事件发生与右删失
  类别: 数据标准
  适用学科: 公共卫生
  适用字段:
  - 随访时长
  - 事件标记
  - 退出时间
  - event
  触发条件: 未观察到事件的受试者被记成事件时间0或直接删除
  规则内容: |-
    至少记录观察时长和事件状态，并区分研究截止、失访和事件发生。右删失表示真实事件时间只知道晚于已观察时长，不等于永久无事件或缺失为0；保留终止原因，分析方法还需相应删失假设。
  正例: 随访12个月无已观察事件、随后截止 → 时长12及右删失标记
  反例: 失访时不能把后续状态自动记为健康，也不能将终止时间当事件发生时间
  来源: |-
    SciPy官方文档：CensoredData，左/右/区间删失
    https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.CensoredData.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: public-health-incidence-person-time
  标题: 发病比例与人时发病率分母不同
  类别: 口径规则
  适用学科: 公共卫生
  适用字段:
  - 新发事件
  - 风险人数
  - 随访人时
  - incidence
  触发条件: 随访时长不齐，却把人数分母和人时分母的指标直接比较
  规则内容: |-
    先说明事件定义、风险人群、观察期与重复事件规则。累计发病比例用相应风险人数构造，人时率用风险暴露时间；二者单位和解释不同。人时应按统一时间单位累计，不能把每人记录条数当随访时间。
  正例: 2个新发事件、200人年 → 1/100人年的率，不能直接写成1%的累计风险
  反例: 没有可靠起止时间时，不能用“人数×平均猜测年数”冒充真实人时
  来源: |-
    CDC：Principles of Epidemiology，第3课第2节，发病比例、人时率与患病比例
    https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson3/section2.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: public-health-standard-population-comparison
  标题: 年龄标化率比较要使用同一标准人口
  类别: 口径规则
  适用学科: 公共卫生
  适用字段:
  - 年龄组
  - 组别率
  - 标准人口
  - 标化率
  触发条件: 两份报告都写年龄标化率，但标准人口或年龄组范围不同
  规则内容: |-
    直接标化需将年龄别率按指定标准人口权重合成。比较时核对标准人口、年龄段、开放年龄组、粗率来源和方法；标化率是用于比较的构造指标，不等于样本人群的实际风险，也不能直接还原真实病例数。
  正例: 统一标准人口与年龄组后再比较，并报告所用标准与方法
  反例: 用不同国家或年份的标准人口得到的标化率，不因名称相同就自动可比
  来源: |-
    CDC NCHS：Age adjustment（2026-09-16更新；参考标准人口方法）
    https://www.cdc.gov/nchs/hus/sources-definitions/age-adjustment.htm
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: public-health-risk-versus-odds
  标题: 风险比与优势比不能直接互换
  类别: 口径规则
  适用学科: 公共卫生
  适用字段:
  - 暴露
  - 结局
  - RR
  - OR
  触发条件: 把OR解释为风险增加倍数，或从病例对照样本直接估计总体风险
  规则内容: |-
    风险以事件人数除风险人数，优势以事件与非事件人数之比构造；RR与OR的分母结构不同。需按研究设计和抽样方式选择解释，不能把病例对照样本中的病例占比当总体风险；任何近似都需说明成立条件。
  正例: |-
    自拟两组风险0.5与0.25：RR=2，而OR=(0.5/0.5)/(0.25/0.75)=3
  反例: OR=3不自动表示个人风险变成三倍，也不能仅凭OR推断绝对风险
  来源: |-
    CDC：Principles of Epidemiology，第3课第5节，RR与OR
    https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson3/section5.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
