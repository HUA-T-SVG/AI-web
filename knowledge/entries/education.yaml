- id: education-headcount-student-course
  标题: 人数人次与当量学生数应分开
  类别: 数据标准
  适用学科: 教育学
  适用字段:
  - 学号
  - 课程号
  - 选课记录
  - 人数
  - FTE
  触发条件: 把选课行数、去重学生数或FTE互相代用
  规则内容: |-
    人数通常按所声明主体范围去重，人次依事件或选课粒度计数，当量学生数按指定活动量折算。报告须写清统计期、主体键及折算公式；同一人多门课不能当多名学生，FTE也不能假设总等于自然人数。
  正例: 3名学生各选2门课 → 可有6条选课记录，但去重人数为3
  反例: 重复选课是否算多个人次仍要按制度；不能默认“每行=一人”
  来源: |-
    NCES IPEDS：12-month Enrollment，去重人数与FTE定义（方法参考）
    https://nces.ed.gov/ipeds/survey-components/5
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: education-age-at-reference-date
  标题: 年龄分组需使用声明的统计基准日
  类别: 数据标准
  适用学科: 教育学
  适用字段:
  - 出生日期
  - 统计日期
  - 入学年龄
  - age
  触发条件: 按出生年份相减生成年龄，或用运行当天代替报表指定日期
  规则内容: |-
    明确使用周岁、其他年龄制度或特定学年年龄，并取得基准日及闰日处理约定。周岁通常需要检查当年生日是否已过，不能只减年份；重跑历史报表不能自动换成今天。缺失生日时保留不确定性。
  正例: 自拟出生2010-10-01、基准2020-09-01 → 周岁9，不是10
  反例: 入学资格截止日与人口统计基准日可能不同，不能混用
  来源: |-
    Python官方文档：datetime（日期表示与比较，不规定入学年龄口径）
    https://docs.python.org/3/library/datetime.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 待核对
- id: education-cohort-denominator
  标题: 毕业或留存指标需固定队列与观察期
  类别: 口径规则
  适用学科: 教育学
  适用字段:
  - 入学队列
  - 毕业状态
  - 转入
  - 转出
  触发条件: 计算毕业率或留存率时混入不同入学批次或随意调整分母
  规则内容: |-
    先定义队列进入条件、完成标准、观察窗口及允许的转入转出规则，并保留状态变动证据。某年毕业人数不能直接除以该年在校人数来替代队列完成率；未知去向不能自动算转出或毕业。
  正例: 同一入学队列按规定观察期追踪，按适用制度记录分母调整
  反例: 国外某指标允许剔除的情况不能直接用作本校剔除依据
  来源: |-
    NCES：Adjusted cohort graduation rate（美国指标定义，参考队列口径结构，不代替本地制度）
    https://nces.ed.gov/programs/dropout/ind_04.asp
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: education-assessment-weight-total
  标题: 成绩权重与缺项处理需明确
  类别: 口径规则
  适用学科: 教育学
  适用字段:
  - 平时成绩
  - 期末成绩
  - 权重
  - 总评
  触发条件: 总评由多项成绩合成，但权重基准、缺项或舍入规则不清楚
  规则内容: |-
    先取得本课程有效考核方案，明确权重用0至1还是百分数、各项纳入范围和缺考/免考处理。仅在制度明确时按权重合成；缺项不能自动改0或把其余权重重新归一。最后按规定环节舍入并核对临界记录。
  正例: 自拟方案30%与70%，两项80和90 → 未舍入合成为87
  反例: 一项缺考时不能擅自把另一项权重提高到100%，也不能把30当0.30直接乘
  来源: |-
    Python官方文档：decimal（仅支持算术与舍入方法，不替代教务制度）
    https://docs.python.org/3/library/decimal.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 待核对
- id: education-teaching-evaluation-nonresponse
  标题: 评教结果需核对响应范围再外推
  类别: 清洗案例
  适用学科: 教育学
  适用字段:
  - 班级
  - 受邀人数
  - 响应人数
  - 评教得分
  触发条件: 只凭已响应评教者的均分，对全班或全校作结论
  规则内容: |-
    记录实际有资格、被邀请和有效响应的人数，以及施测方式和匿名机制。低或高回收率都不能单独证明是否存在无应答偏差；先核对课程与群体覆盖，报告结果适用范围。比较教师前还需确认问卷、时间和课程情境可比。
  正例: 报告某课程有效响应人数及受邀范围，并说明未响应者信息限制
  反例: 回收率高不自动证明无偏，样本多也不消除课程覆盖差异
  来源: |-
    Pew Research Center：U.S. Survey Methodology，总调查误差及资料记录
    https://www.pewresearch.org/u-s-survey-methodology/
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
