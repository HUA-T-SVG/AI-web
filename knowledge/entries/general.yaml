- id: general-missing-negative-code
  标题: 负数编码表示未回答
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 该列为数值列，且出现负数取值时
  规则内容: |-
    国内社会科学类调查数据常用负数区分未回答的原因，例如 -1 不适用、-2 不知道、-3 拒答、-9 缺失。这些数字不是真实测量值。具体码表必须以该数据集自己的说明文档为准，不同数据集的约定并不一致。若在确认含义之前就当成数值统计，均值、最值、分布会被整体污染。
  正例: -9 通常是缺失，需按该数据的码表确认
  反例: -3 拒答与 -2 不知道是两种不同的缺失机制，不应简单合并成一个「缺失」
  来源: 国内社会科学调查数据的常见约定；具体码表待按数据集说明文档核对
  权威度: 行业
  核验状态: 待核对
- id: general-missing-sentinel
  标题: 哨兵值当作缺失
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 该列的取值里出现 99、999、-99 这类明显脱离其余取值范围的整齐数字
  规则内容: |-
    调查数据里 99、999、998、997 常被用来表示「未回答」「不适用」等状态，而不是真实数值。判断线索是它们与其余取值之间存在断崖式的间隔（例如年龄列其余值都在 0-120 之间）。这类值一旦当成数值参与统计，均值与标准差会严重失真。
  正例: 年龄列出现 999 而其余取值均小于 120 → 疑似缺失编码
  反例: 收入列出现 999 → 可能是真实的 999 元，需结合该字段的取值范围判断
  来源: 调查数据处理的通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: general-missing-literal
  标题: 文字形式的缺失标记
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 缺失
  - 未填写
  - 备注
  - remark
  - note
  触发条件: 该列取值中出现 NA、N/A、null、无、未填、不详、/、-- 这类文字
  规则内容: |-
    缺失不只表现为空白单元格，还常被写成 NA、N/A、null、NaN、无、未填、未填写、不详、不知道、/、--、／ 等文字。这些字符串在类型推断时会让原本的数值列或日期列被误判为文本列，进而导致该列所有检查失效。规范化时应先统一识别为缺失，再做类型推断。
  正例: 「无」「未填」应识别为缺失
  反例: 「无业」是职业的合法取值，不能因为含有「无」字就判成缺失
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: general-date-ambiguous
  标题: 日期格式存在多义
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 日期
  - 时间
  - date
  - time
  - 年月日
  触发条件: 该列取值为 01/02/2024 这类斜杠或点分隔的日期
  规则内容: |-
    01/02/2024 到底是 1 月 2 日还是 2 月 1 日，取决于该数据是月在前还是日在前，两种约定在国内数据里都常见。此外还有 2024.1.2、20240102、2024年1月2日 等写法。在无法确定约定时不应自动转换 —— 转换错了会把整列日期整体错位，而且错得很隐蔽。
  正例: 同一列内格式统一为 2024-01-02 → 可安全解析
  反例: |-
    同一列里既有斜杠格式又有中文格式 → 无法确定月日顺序，需询问数据提供者；本条只讲月日顺序不确定；同列混了文本与日期值导致类型推断失败是另一类问题
  来源: 日期解析的通用问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-date-excel-serial
  标题: Excel 序列号被当成数值
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 日期
  - 时间
  - date
  - time
  触发条件: |-
    列名含日期含义，但该列被推断为数值列，取值是 40000-50000 之间的整数
  规则内容: |-
    从 Excel 读取的日期有时会以序列号形式出现，例如 45000 表示 2023 年前后某一天。这类列在画像里完全正常 —— 类型是数值、没有缺失、分布也合理，所以纯统计手段发现不了，必须靠列名语义与取值范围共同判断。
  正例: |-
    「出生日期」列取值在 20000-50000 之间 → 疑似 Excel 序列号
  反例: 「工号」列取值为 45000 → 是真实的编号，不要当日期转换
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-unit-mixed
  标题: 同一列混用单位
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 单位
  - 剂量
  - 浓度
  - 重量
  - 长度
  - 重量kg
  - 身高
  触发条件: 该列取值带单位后缀，或数值分布呈现两个相距很远的峰
  规则内容: |-
    同一列里混用 mg、g、μg 是常见错误（1 g = 1000 mg）。判断线索有两个：取值里带单位词（如「120mg」「0.12g」），或数值分布出现双峰且两峰之间大致相差 1000 倍。换算前必须先确认该列的基准单位，换算方向搞反会让所有数值差一千倍。
  正例: 120mg 与 0.12g 是同一个量，应统一后再统计
  反例: 身高 170（cm）与体重 65（kg）是同一个人不同字段，不是单位混用
  来源: 科研数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-gender-code
  标题: 性别字段的多种写法
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 性别
  - sex
  - gender
  触发条件: 该列为取值很少的分类列，且取值疑似表示性别
  规则内容: |-
    性别字段的写法极不统一：男/女、1/2、M/F、male/female、男性/女性。其中 1/2 与 M/F 的对应关系在不同数据里可能相反，必须结合该数据的说明确认，不能假设 1 一定是男。这是最容易静默出错的一类字段 —— 归并方向搞反了，整个按性别分组的分析结果都是反的，而且看起来完全正常。
  正例: 男、男性、M 归为同一类
  反例: |-
    不要假设 1 一定是男，需查该数据的编码说明；性别是定类字段、不是布尔值，不要套用「是否」类字段的归并规则
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: general-excel-merged-cells
  标题: Excel 合并单元格只留左上角值
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 从 Excel 读到某列大量空白，而该列在原表里看着是填满的
  规则内容: |-
    Excel 的合并单元格在读取时只有左上角那个格子有值，其余格子读出来是空。「性别」这类列一旦被纵向合并过，直接读会得到大量假缺失，缺失率与分组统计全部失真。从带合并单元格的表格里复制粘贴也会得到同样的结果。处理方式是先确认原表确实做过合并，再向下填充；不能一律向下填充。
  正例: |-
    「地区」列原表里北京合并了 20 行 → 读进来只有第 1 行有值，其余 19 行为空
  反例: |-
    「备注」列本来就只有少数几行有值 → 不是合并单元格，向下填充会凭空造出 19 条假记录
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-multi-header-rows
  标题: 多级表头被读成数据行
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 读进来第一行或前两行的取值不像数据，像说明文字或单位
  规则内容: |-
    带两级表头的表（第一行「基本情况」，第二行「性别」「年龄」）直接读会让第一行变成一条数据记录，且列名变成「基本情况」这类无法识别的字段。判定线索是首行的取值数量、类型与其余行明显不同。必须先定位真正的表头行，再决定从第几行开始读。
  正例: |-
    第 1 行是「基本情况／基本情况／健康状况」、第 2 行是「性别／年龄／自评」→ 表头在第 2 行
  反例: |-
    第 1 行就是「性别／年龄／自评」且取值都是数字或短文本 → 单级表头，不要跳过任何行
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: general-footer-summary-rows
  标题: 表尾合计行混在数据里
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 某几行的数值明显大于其余行，且行内文本像「合计」「平均」「总计」
  规则内容: |-
    Excel 表尾常带合计、平均、占比这类汇总行，读取时会被当成普通数据记录。它们会让行数多出几条、均值被拉高、分组统计里凭空多出一个「合计」类别。判定线索是首列文本含合计类词，或某数值列恰好等于其余行之和。应在读取阶段识别排除，不要事后按数值大小猜。
  正例: 末行首列为「合计」、人数列等于上方各行之和 → 汇总行，不是数据
  反例: 某行人数确实远大于其他行 → 可能是真实的大单位，不要按数值大小剔除
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-boolean-variants
  标题: 布尔列的多种写法
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 是否
  - 有无
  - 同意
  - 标记
  - flag
  - is
  触发条件: 该列唯一值很少，且取值疑似表示真与假
  规则内容: |-
    是否类字段的写法极不统一：是／否、Y／N、1／0、TRUE／FALSE、T／F、有／无、√／×。同一列里混用两套写法会让分组时出现四个类别而不是两个。更危险的是 1／0 与 Y／N 的对应关系在不同数据里可能相反，不能假设 1 或 Y 一定表示「是」。
  正例: |-
    同一列只出现 是／否 一套写法 → 按该套直接归并；混用 1／0 与 Y／N 时先查该数据的编码说明
  反例: |-
    同一列里 1 与 Y 混用时若默认 1 表示「是」，而该数据实际 1 表示「否」→ 归并方向整体反了，分组结果却看起来完全正常；性别、民族这类定类字段取值虽少也不是布尔值，不可套用本条
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: general-interval-text
  标题: 区间型取值是定序类别不是数值
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 年龄段
  - 区间
  - 范围
  - 分组
  - 档次
  触发条件: 该列取值形如「A-B」，两端都是数字
  规则内容: |-
    「18-25岁」「3-5次」「5000-8000元」这类区间取值含数字，但它们是定序类别，没有唯一数值。若被解析成数值，会算出「18 减 25」这类无意义的中间值；若被当成普通文本，排序又会按字典序把 18-25 排在 3-5 之后。处理方式是保留为有序类别，另建一个用区间下限或中值排序的辅助列。
  正例: 「18-25岁」应保留为有序类别，排序用辅助列
  反例: 「2020-2021」可能是学年区间，语义与年龄区间不同，不要套同一条规则
  来源: 调查数据处理的通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: general-percent-scale-mixed
  标题: 比例与百分数两种量纲混用
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 比例
  - 占比
  - 百分比
  - 率
  - percent
  - rate
  触发条件: 该列取值里既有小于 1 的小数，又有大于 1 的数
  规则内容: |-
    同一列里 0.15 与 15 可能表示同一个比例，前者基准是 1、后者基准是 100。混用时算出的均值既不是 0.15 也不是 15，而是一个无法解释的中间数。判定线索是取值同时存在小于 1 与大于 1 的两簇。比例列出现越界值（小于 0 或大于 100）通常是量纲不统一或把分子填成了分母，不要直接截断到边界 —— 截断会掩盖真实的错误。统一前必须确认基准量纲，换算方向搞反会让所有比例差 100 倍。
  正例: 0.15 与 15% 是同一个比例，统一到 1 为基准后再统计
  反例: |-
    某列取值 1.2 可能是「1.2 倍」而不是 1.2%，不要见大于 1 就当百分数处理；增长率、变化率可以超过 100%，这类列不适用本条
  来源: 统计分析通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-category-other-explosion
  标题: 其他与自由填写列导致类别爆炸
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 其他
  - 其他请注明
  - 备注
  - 说明
  - 补充
  触发条件: 分类列里出现「其他」这一取值，或唯一值数量远超该题的选项数
  规则内容: |-
    问卷里的「其他（请注明）」会把原始填写内容原样带进来，同一列可能出现上百个只出现一次的取值。判定线索是唯一值数量远超选项数。「其他」本身是合法类别，不应与空白或缺失合并，但自由填写的内容需要先归并再看分布。
  正例: 「其他-退休」与「其他-已退休」先归并，再与「其他」类别一同考察
  反例: 不要把「其他」当缺失填掉 —— 它是有信息量的一个选项
  来源: 问卷数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-scientific-notation
  标题: 长数字被转成科学计数法
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 学号
  - 编号
  - 身份证
  - 电话
  - 手机号
  - 账号
  - 卡号
  触发条件: 该列取值为 1.23E+17 这类形式，或长度达到 15 位以上
  规则内容: |-
    超过 15 位的纯数字在电子表格与部分解析库里会自动转成科学计数法，末几位被抹成 0，且这个损失在读进来的时候就已经发生、事后无法还原。判定线索是取值里出现 E，或所有取值末尾都是若干个 0。这类列必须按文本读取 —— 长度本身也是信息，如身份证固定 18 位。
  正例: 18 位身份证号按文本读取，末位还可能是字母 X
  反例: 1.23E-5 这类科学计数法是真实的浓度值，不要当标识列处理
  来源: Excel 与 CSV 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-fullwidth-comma-csv
  标题: 全角标点导致分隔错位
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 某列取值里出现全角逗号或全角引号，或数据行的列数与表头不符
  规则内容: |-
    中文输入法下打出的全角逗号被当成文本时，用半角逗号做分隔的 CSV 会把一个字段劈成两列，导致该行整体右移、后续所有列错位。判定线索是某几行比表头多出列，或多出的列内容像是被截断的半句话。这类行必须整行剔除后重新导出，不要按列名硬对齐。
  正例: 「北京，朝阳区」在 CSV 里应被引号包裹，否则会被拆成两列
  反例: 字段本身已用引号包裹时，引号内的逗号是安全的，不要一并替换
  来源: CSV 格式的已知解析行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-newline-in-cell
  标题: 单元格内换行符破坏行结构
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 备注
  - 说明
  - 开放题
  - 其他
  - remark
  触发条件: 读进来的行数明显多于预期，或某列出现不完整的句子
  规则内容: |-
    单元格里的换行（Alt+Enter）导出成 CSV 时若没被引号包裹，会把一个逻辑行拆成两行，导致行数虚增、后续列整体错位。判定线索是行数明显偏多、且有若干行的首列为空。处理方式是改用支持引号内换行的解析器重读，而不是把空行直接删掉。
  正例: 备注列含换行时，导出应保留引号包裹，读入应支持引号内换行
  反例: 数据里真正的空白分隔行是结构的一部分，不要因为要修换行就把它一并吃掉
  来源: CSV 格式的已知解析行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-formula-cell-value
  标题: 公式列读到的是公式文本或过期缓存
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 某列取值以等号开头，或同一行的取值恒等于其他列的组合
  规则内容: |-
    电子表格里由公式算出的列，不同读取方式会给出三种结果：公式文本（如等号开头的一串）、上次打开时缓存的值、或空。缓存值可能早已过期，公式文本则完全无法参与计算。这类列应在读取时按公式重算一遍，或要求数据提供者另存为数值版本。
  正例: 「总分」列是求和公式 → 需重算或改用数据提供者保存的数值版本
  反例: 取值里以等号开头的文本（如某种合格记号）不是公式，不要重算
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-encoding-mojibake
  标题: 中文编码错配导致取值碎裂
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 中文取值里出现大量乱码字符，或唯一值数量比预期多很多
  规则内容: |-
    中文 CSV 常见 GBK／GB18030 与 UTF-8 两种编码，用错一个就会得到一片乱码。更隐蔽的情况是部分行乱码、部分行正常，此时同一类别会被劈成「北京」与乱码两簇，分组结果凭空多出几个类别。判定线索是一个中文词的多种乱码写法同时出现。读错一次得到的乱码不可逆，必须先固定编码再读。
  正例: 先探测编码再读；同一列同时出现「北京」与其乱码形式 → 编码错配
  反例: 数据里本来就有外文或生僻字 → 不要因为「看不懂」就断定是乱码
  来源: 中文文本处理的通用问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-column-name-bom
  标题: 表头带字节序标记导致列名对不上
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 中文 CSV 读进来后第一列的列名看着正常，但按列名取值取不到
  规则内容: |-
    带字节序标记的 UTF-8 CSV 被按普通 UTF-8 读时，标记会黏在第一个列名前面，看起来一模一样但字符串比较不相等。表现是按列名取列失败、或某些列名匹配规则莫名不生效。读取时应显式用 utf-8-sig，或统一剥掉列名首部的不可见字符。
  正例: 列名「学号」前有一个不可见标记 → 用 utf-8-sig 读取后消失
  反例: 列名里本来就有全角字符（如「学　号」）→ 那是录入问题，不是字节序标记
  来源: CSV 与编码处理的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-column-name-duplicate
  标题: 表头有重复列名
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 备注
  - 说明
  - 其他
  - 备注2
  - remark
  触发条件: 该列名在表头里出现两次以上
  规则内容: |-
    中文表里「备注」「其他」这类列名重复很常见，读取时后一列会覆盖前一列，或被自动改名成「备注.1」。前者静默丢数据，后者会让按列名取值的代码取到错的列。必须在读取阶段就检测并报出重复列名，交由用户决定合并还是重命名。
  正例: 表头出现两个「备注」→ 报为问题并重命名为「备注_1」「备注_2」
  反例: 「备注」与「备注说明」是两个不同的列名，不算重复
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: general-column-name-whitespace
  标题: 列名前后有空白或换行
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 按列名取列时取不到，但列名看着完全正确
  规则内容: |-
    表头单元格里常有行尾空格、行内换行或全角空格（从 Word 粘贴表头时会带上）。它们在界面上看不出来，却让列名匹配全部失效 —— 包括本知识库的「适用字段」加权。应在读取后统一对列名做去空白与全半角规范化。
  正例: 列名「学号 」与「学号」规范化后视为同一列
  反例: 不要对列名做大小写之外的语义改动 ——「年龄」与「年龄组」是两列
  来源: 中文数据录入的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-thousand-separator-number
  标题: 数值列带千分位分隔符
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 金额
  - 收入
  - 数量
  - 费用
  - 价格
  - amount
  触发条件: 该列取值里含逗号或空格，且整体不像纯数字
  规则内容: |-
    从报表或网页复制的数字常带千分位（「1,234」）、空格分组（「1 234」）或货币符号。这类列会被判为文本，所有数值检查静默失效；更糟的是按逗号分隔的 CSV 会把一个数字劈成两列。需先剥离分隔符与符号再做类型推断。
  正例: 「1,234」剥离后得到 1234
  反例: 若该列用逗号表示小数位（部分区域格式），剥离会改变数值大小，需先确认约定
  来源: Excel 与 CSV 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-accounting-negative
  标题: 负数用括号或尾部负号表示
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 金额
  - 差额
  - 增减
  - 收入
  - 盈亏
  - amount
  触发条件: 该列取值形如括号包裹或尾部带负号，而列名暗示可以有负值
  规则内容: |-
    会计与统计报表里负数常写成括号（括号内数字表示负值）或把负号放在尾部。若按原样处理，这些值或被判为文本、或正负号反了。判定线索是取值以括号包裹或尾部带负号，且该列按列名允许为负。
  正例: 「(1,234)」应解析为 -1234
  反例: 括号在中文文本里也用于补注（如「合计(含税)」），这类不是负数
  来源: 报表数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-na-as-real-value
  标题: NA 可能是真实取值而不是缺失
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 地区
  - 省份
  - 国家
  - 洲
  - 区域
  - region
  - area
  触发条件: 该列的 NA 出现频率明显高于其它缺失写法，或列名是地区类
  规则内容: |-
    地区、国家、洲这类列的 NA 可能指北美洲的正式缩写，把它当缺失会丢掉真实数据。判定线索是该列的 NA 占比异常高、且与其它缺失写法（空、未填）的分布不一致。规范成缺失之前必须先确认 NA 在这个字段里代表什么。
  正例: 地区列同时有 EU、AP、NA → NA 是北美洲，不是缺失
  反例: 量表列出现 NA → 更可能是缺失标记，需按该数据的说明判断
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: general-skip-logic-missing
  标题: 跳转题造成的结构性缺失
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 某列的缺失高度集中，且与另一列的取值完全对应
  规则内容: |-
    问卷跳转逻辑会造成「必然为空」的缺失 —— 例如性别为男时，「是否怀孕」一定为空。这类缺失不是数据问题：按普通缺失率统计会误判成严重缺失，做均值填补或整行删除则会毁掉数据。判定线索是缺失与某一列的取值一对一对齐。处理方式是把它标为「不适用」而不是「缺失」。
  正例: 「是否怀孕」在性别为男的行全部为空 → 不适用，不是缺失
  反例: 若缺失与任何列都不相关 → 是真实缺失，需按缺失机制分析
  来源: 问卷数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-excel-1904-datesystem
  标题: 日期基准不同导致日期整体偏移
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 日期
  - 时间
  - date
  - time
  - 年月日
  触发条件: 日期列与另一份来源的同一列整体相差约 4 年（1462 天）
  规则内容: |-
    早期 Mac 版 Excel 默认用 1904 日期基准，Windows 版用 1900，两者相差 1462 天。若两份数据来自不同基准的工作簿，日期会整体偏移约 4 年，而每一行单独看都非常合理、不会被异常值检查发现。判定线索是与可信来源逐行比对时发现恒定偏移。
  正例: 同一批日期在两份文件里恒定差 1462 天 → 疑似日期基准不同
  反例: 相差几天到几十天更可能是录入或口径差异，不是基准问题
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-id-checksum
  标题: 身份证号有校验位且有两代长度
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 身份证
  - 身份证号
  - 证件号
  - idcard
  触发条件: 该列长度不统一，或取值末尾疑似字母
  规则内容: |-
    身份证号现有 18 位（末位可能是字母 X）与早期的 15 位两代，18 位末位是按加权算法算出的校验位。长度不齐通常说明混了两代。校验位可以验算，但验算前必须确认识别的是哪一代 —— 15 位不含校验位。这类列必须按文本读取，按数值读取会丢精度或前导零。
  正例: 18 位末位为 X 是合法的，不是异常字符
  反例: 不要用末位是否为数字判断有效性 —— 15 位一代整体更短，含义不同
  来源: 身份信息字段的通用校验约定（具体校验算法待团队对照权威口径）
  权威度: 行业
  核验状态: 待核对
- id: general-address-levels-mixed
  标题: 地址列的行政区划层级不齐
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 地址
  - 所在地区
  - 籍贯
  - 住址
  - address
  触发条件: 该列取值有的到省、有的到市、有的到区，层级不一致
  规则内容: |-
    地址列常见三种问题：层级不齐（只到省与到区并存）、重复层级（省市同名连写两次）、以及简称与全称混用。按此列分组会得到一堆本应合并的类别。规范化前必须先确定目标层级。
  正例: 统一到省级后再分组，或拆成省、市、区三列
  反例: 直辖市在部分编码体系里省级与市级同名，拆分时不要当成重复
  来源: 中文地址数据处理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-education-vs-degree
  标题: 学历与学位是两个不同字段
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 学历
  - 学位
  - 受教育程度
  - 最高学历
  - degree
  触发条件: 表里同时存在学历列与学位列，或只有一列但取值混了两类
  规则内容: |-
    学历指就读经历（本科、硕士研究生），学位指授予称号（学士、硕士），两者不是一一对应 —— 可以是研究生学历但没有学位。把两类取值放进同一列会让类别体系自相矛盾。判定线索是同一列里同时出现「本科」这类学历值与「学士」这类学位值。
  正例: 学历列只放本科、硕士研究生；学位列只放学士、硕士
  反例: |-
    不要因为「研究生」与「硕士」常被混用就当成同一字段 —— 学历口径下研究生指硕士阶段
  来源: 教育统计的通用口径（具体代码待团队对照现行标准原文）
  权威度: 行业
  核验状态: 待核对
- id: general-enrolled-status
  标题: 在读与已毕业必须分开
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 学历
  - 受教育程度
  - 文化程度
  - 就读状态
  - edu
  触发条件: 该列取值里含「在读」「应届」「结业」「肄业」这类状态词
  规则内容: |-
    「本科在读」与「本科」是两个不同状态，合并会同时污染学历分布与在学、已毕业的划分。但它们在字面上高度相似，按字符串包含关系处理很容易误并。规范做法是把学历与就读状态拆成两列分别记录。
  正例: 「本科在读」拆成 学历=本科、状态=在读
  反例: 「本科」与「本科在读」不应因为字面接近就归并成同一取值
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-org-name-variants
  标题: 机构名称的全称与简称混用
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 单位
  - 学院
  - 学校
  - 机构
  - 部门
  - 单位名称
  触发条件: 该列的唯一值数量远超实际机构数
  规则内容: |-
    同一机构常有多种写法：全称、简称、加括号后缀、以及带校区或分院的写法。按此列分组会把一个机构拆成好几个。判定线索是唯一值数量明显多于机构实际数量，且取值之间是包含关系。归并前需确认括号内容是分支还是同一机构。
  正例: 「北京大学」与「北大」应归并
  反例: 「北京大学」与「北京大学医学部」在部分统计口径里是不同单位，不可直接归并
  来源: 中文机构名称处理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-unit-in-header
  标题: 单位写在表头而不是取值里
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 体重
  - 身高
  - 金额
  - 时长
  - 距离
  - 剂量
  - 重量
  触发条件: 列名里含括号或单位词，如体重括注 kg
  规则内容: |-
    单位写在表头时，数值本身是裸数字，单位信息只存在于列名里。一旦列名被规范化、截断或重命名，单位就丢了 —— 而数值看上去依然合理。处理时应把单位从列名里提取出来单独记录，不要静默丢弃。
  正例: 「体重(kg)」→ 列名「体重」，单位 kg 单独记录
  反例: 列名里的括号未必是单位，「得分(反向题)」里的括号是说明，不是单位
  来源: 科研数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-absolute-vs-relative
  标题: 绝对数与相对数放在同一列
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 人数
  - 数量
  - 合计
  - 频次
  - count
  - total
  触发条件: 该列取值跨度极大，且部分取值是小数
  规则内容: |-
    同一列里既有绝对数（人数 120）又有相对数（占比 0.12 或 12%）会让分布出现两个相距极远的簇，均值毫无意义。判定线索是出现小数而语义上是计数、或最大值与最小值相差几个数量级。这类问题必须拆列，不能靠剔除异常值解决。
  正例: 把「人数」与「占比」拆成两列
  反例: 人均值本来就可以是小数，不要因为出现小数就判定为混了相对数
  来源: 统计报表的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-ordinal-order-lost
  标题: 有序分类的排序被字典序打乱
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 学历
  - 年龄段
  - 满意度
  - 等级
  - 档次
  - grade
  触发条件: 该列为有序分类，但排序结果与常识顺序不符
  规则内容: |-
    定序变量按字典序排会得到与常识完全相反的错序，按码值排又依赖码值恰好与顺序一致 —— 而码值顺序并不保证如此。应显式声明顺序（映射表或有序类别类型），不要依赖默认排序。
  正例: 学历显式声明顺序后按 小学→初中→高中→本科→硕士→博士 排列
  反例: 民族、专业这类定类变量没有顺序，排序方式不影响结论
  来源: 统计学基本口径
  权威度: 行业
  核验状态: 待核对
- id: general-multi-select-in-single
  标题: 单选题列里出现多选答案
  类别: 数据标准
  适用学科: 通用
  适用字段: []
  触发条件: 该列本应是单选，但出现用逗号或分号连接的多个选项
  规则内容: |-
    问卷导出时多选题偶尔被塞进一列（用分隔符连接的多个选项号）。这会让该列的唯一值数量爆炸，且每个组合都被当成独立类别。判定线索是取值里出现分隔符且分隔后的片段都落在选项集合内。应拆成多个 0/1 列或多值集合再分析。
  正例: 取值「1,3」→ 拆成 选项1=1、选项3=1
  反例: 备注列里的逗号是自然语言，不是多选答案
  来源: 问卷数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-weight-column-detected
  标题: 抽样权重列被当成普通变量
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 权重
  - 权数
  - weight
  - 权重系数
  - wgt
  触发条件: 表里存在取值围绕 1 波动、且列名含权重含义的列
  规则内容: |-
    抽样调查数据常带权重列，正确做法是用加权统计，而多数自动工具会直接算未加权结果，两者在样本结构与总体不一致时会差很多。判定线索是列名含权重含义且取值大部分接近 1。这类列的存在意味着该数据集的结果原则上应当加权。
  正例: 检测到权重列 → 提示「不加权的比例可能不代表总体」
  反例: 权重列取值全为 1 时，加权与不加权等价，无需特别处理
  来源: 抽样调查的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-timestamp-precision
  标题: 时间戳精度不一致
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 时间
  - 日期
  - 创建时间
  - 更新时间
  - time
  - date
  触发条件: 同一列里有的值精确到秒、有的只到天
  规则内容: |-
    同一时间列里混着「到天」与「到秒」两种精度：按字符串比较会得出错误的时间先后，按时间戳比较则日期部分会被补成零点，这会让同一天内的事件排到最前。跨表合并时精度不同也常导致本该相等的键对不上。需先统一精度再做任何比较或连接。
  正例: 统一到秒后再比较，或统一截断到天
  反例: 只到天的日期补上零点后与真实发生在当天的时刻混排，会打乱顺序
  来源: 日期时间处理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-gb-address-code
  标题: 行政区划代码逐年调整
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 行政区划
  - 省份
  - 地区
  - 城市
  - 区县
  - region
  触发条件: 该列取值为行政区划编码，且数据跨年份
  规则内容: |-
    行政区划代码以国家标准原文为准，且每年都有调整（撤县设区、新设市等），跨年份数据不能共用一份码表。编码的分段还有层级含义，前若干位代表上级区划。凭记忆或网络二手资料填码值极易出错，使用前先确认数据年份与对应的码表版本。
  正例: 使用与该数据年份匹配的行政区划码表
  反例: 用最新码表读五年前的数据 → 会出现查无此码，或旧区划被错误归并
  来源: 行政区划代码国家标准（GB/T 2260；具体码值待团队核对原文）
  权威度: 国标
  核验状态: 待核对
- id: general-gb-education-code
  标题: 学历与专业代码有新旧版
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 学历
  - 受教育程度
  - 文化程度
  - 最高学历
  - 专业
  - 学科
  - degree
  触发条件: 该列取值为学历或专业编码，且类别数超出预期
  规则内容: |-
    学历代码与学科专业代码都有新旧版本，且分类粒度不同 —— 学科门类与一级学科不是一回事。同一批数据里混用两版，会出现语义重复的成对取值。以国家标准原文为准，使用前先确认该数据用的是哪一版、哪一级粒度。
  正例: 确认该数据用的是哪一版学历代码与哪一级专业分类后再解读
  反例: |-
    把学科门类的码值当一级学科的码值用 → 粒度错位，归并结果全错；本条讲的是选错码表版本与粒度；同一批数据内部混了两版编码属于清洗案例那一类
  来源: |-
    学历与学科专业代码国家标准（GB/T 4658 等；具体版本与码值待团队核对原文）
  权威度: 国标
  核验状态: 待核对
- id: general-gb-ethnic-code
  标题: 民族编码与自由填写
  类别: 数据标准
  适用学科: 通用
  适用字段:
  - 民族
  - 民族成分
  - ethnicity
  触发条件: 该列取值为短编码或民族名称，且出现超出标准类别的取值
  规则内容: |-
    民族有对应的国家标准编码，码值必须以原文为准，不能凭记忆或网络二手资料填写。实际数据里还常出现超出标准类别的自由填写（如写到具体支系、或写成别称）。这类值不应直接判为错误，也不应与标准类别自动合并 —— 需先对照码表再交人工确认。
  正例: 出现标准类别之外的自填值 → 单独列出交人工确认，不自动归并
  反例: 不要因为某个自填值字面上像某个标准类别就直接合并，可能不是同一个民族
  来源: 民族编码相关国家标准（具体标准号与码值待团队核对原文）
  权威度: 行业
  核验状态: 待核对
- id: general-missing-mechanism
  标题: 区分缺失的三种机制
  类别: 口径规则
  适用学科: 通用
  适用字段: []
  触发条件: 某列缺失率较高，或缺失率在不同子群体之间差异明显
  规则内容: |-
    缺失分三种：完全随机（MCAR）、随机（MAR）、非随机（MNAR）。判断线索是把该列的缺失率按其他列分组比较 —— 各组差异显著就说明不是完全随机，此时直接删除缺失行会让样本产生系统性偏差。另外，「拒答」与「不知道」属于不同的缺失机制，不应简单合并成一个缺失。
  正例: 缺失率在城市组 3%、农村组 25% → 疑似 MAR，需按组分析
  反例: 全表缺失率均匀为 5% → 更像 MCAR，可直接删除缺失行
  来源: 缺失数据处理的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-likert-range
  标题: 李克特量表的常见取值
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 量表
  - 题项
  - item
  - 得分
  - score
  触发条件: 该列为整数，且唯一值数量很少（4 到 11 个）
  规则内容: |-
    常见李克特量表为 1-5、1-7、0-10 点。若出现 0 或 8、9 这类值，需先确认是编码错误还是使用了非标准量表。含反向题的问卷必须先反向计分再求和，否则总分没有意义 —— 这一点光看数据发现不了，必须结合问卷原文。
  正例: 取值为 1、2、3、4、5 → 5 点量表
  反例: 取值为 1 到 6 → 不在常见量表之列，需核对原始问卷
  来源: 心理测量学通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-ceiling-effect
  标题: 量表分的天花板与地板效应
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 总分
  - 得分
  - score
  - 量表
  触发条件: 该列为量表总分，且取值大量集中在最大值或最小值
  规则内容: |-
    量表分数若大量挤在满分或最低分附近，说明该量表对这个样本缺乏区分度，测量的信息量有限。此时均值会高估或低估真实水平，而且在后续分析里当作连续变量直接做回归也不合适。这属于「数据没问题但结论要谨慎」的情况，应在报告里说明而不是当作质量问题处理。
  正例: 100 分制量表里 60% 的样本得满分 → 存在天花板效应
  反例: 分数近似正态分布 → 无此问题
  来源: 心理测量学通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-fullwidth
  标题: 中文数据的全角与隐形字符
  类别: 口径规则
  适用学科: 通用
  适用字段: []
  触发条件: 列内取值看似相同，却未被当成同一个值
  规则内容: |-
    中文数据里常见四类隐形差异：全角数字（１２３）、全角空格、零宽字符、以及行尾多余的 \r。它们在界面上与正常字符看不出区别，却会导致分组、去重、跨表合并键全部失效。规范化时应统一处理，但要小心不要把「本科」与「本科在读」这类真实差异也一并消除。
  正例: 「本科」与「本科　」（尾部全角空格）应视为同一取值
  反例: 「本科」与「本科在读」是不同取值，不可因规范化而合并
  来源: 中文文本处理的通用问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-measurement-scales
  标题: 测量尺度决定能算什么
  类别: 口径规则
  适用学科: 通用
  适用字段: []
  触发条件: 该列取值都是数字，但语义上是分类或有序类别（编码、等级、量表分）
  规则内容: |-
    定类（性别、民族）、定序（学历、满意度）、定距（温度、年份）、定比（年龄、收入）四种尺度能做的运算不同：定类与定序列不能算均值，定距列的比值没有意义，只有定比列能做乘除。判断尺度要看语义，而不是看取值是不是数字——编码成 1／2／3 的学历依然是定序列，学历 2.3 这个数解释不出任何东西，应给频数分布。把编码列当数值统计是自动画像最常见的误报来源。
  正例: 满意度 1-5 是定序列，报中位数与频数分布
  反例: |-
    年龄是定比列可做倍数比较；年份是定距列，2020 不是 1010 的两倍；年龄即使取值分散也是真正的数值列，应给均值
  来源: 统计学基本口径
  权威度: 行业
  核验状态: 待核对
- id: general-identifier-not-variable
  标题: 标识列不参与统计
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 学号
  - 编号
  - 工号
  - id
  - 样本号
  - 身份证
  - 电话
  触发条件: 该列唯一值比例接近 1，取值几乎无重复
  规则内容: |-
    学号、样本号这类标识列的作用是识别记录，不是测量特征。它们会被自动画像工具当成数值列报出均值与最值，而这些数没有任何意义 —— 学号的平均值不指向任何东西。判定线索是唯一值数等于行数。这类列应排除在所有统计与分布检查之外，只做重复与格式检查。
  正例: 学号唯一值数等于行数 → 标识列，只做重复与格式检查
  反例: 年龄也接近唯一，但它是真实的测量值，应参与统计
  来源: 统计学基本口径
  权威度: 行业
  核验状态: 待核对
- id: general-missing-rate-no-threshold
  标题: 缺失率没有通用阈值
  类别: 口径规则
  适用学科: 通用
  适用字段: []
  触发条件: 需要决定某列缺失多少才该删除或填补时
  规则内容: |-
    「缺失超过 5% 就删列」这类固定阈值没有统计依据。同样的缺失率，出现在随机缺失的辅助变量上可以忽略，出现在关键自变量上会让整个模型失效。判断依据是缺失是否与其他变量相关、以及该列在分析里的角色，不是缺失率本身的大小。删除整列之前必须先看缺失集中在哪里。
  正例: 备注列缺失 60% 但分析不用它 → 保留，不影响结论
  反例: |-
    收入列缺失 8% 却集中在低收入组 → 删缺失行会让样本系统性偏高，不能按阈值机械处理
  来源: 缺失数据处理的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-mean-imputation-bias
  标题: 均值填补会压缩方差
  类别: 口径规则
  适用学科: 通用
  适用字段: []
  触发条件: 打算用均值或中位数填补缺失时
  规则内容: |-
    用同一列的均值填掉缺失，会让该列的方差变小、标准误被低估，相关与回归的系数也会向 0 收缩。缺失越多偏差越大，极端情况下整列变成一个常数。填补前应说明为什么可以填补，并在报告里注明填补方式与填补比例。
  正例: 缺失 2% 且集中在无关紧要的辅助列 → 均值填补可接受，但需注明
  反例: 缺失 30% 的关键变量用均值填补 → 会明显低估标准误，不宜直接填补
  来源: 缺失数据处理的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-outlier-not-error
  标题: 异常值不等于错误值
  类别: 口径规则
  适用学科: 通用
  适用字段: []
  触发条件: 检出 IQR 或 Z 分数标记的异常值时
  规则内容: |-
    统计上离群的值分三种：录入错误、真实存在的极端个体、量纲错配造成的假异常。三者处理方式完全不同 —— 前者要改，中者要留，后者要换算，而仅凭数值大小无法区分，必须回到字段语义与原始记录。机械按 IQR 剔除会连同真实的高收入样本、重症病例这类最有信息量的极端个体一起删掉。
  正例: |-
    收入列出现 999999 且该行其余字段也不自洽 → 疑似录入错误，需核对原始记录
  反例: 收入列出现 500000 且其余信息自洽 → 可能是真实的极端值，不应剔除
  来源: 统计数据清洗的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-rate-not-average-of-rates
  标题: 汇总行的比率不能取平均
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 比例
  - 占比
  - 率
  - rate
  - percent
  触发条件: 该列是比率，且行本身是组级汇总值
  规则内容: |-
    各组的比率要合并成总比率时，必须用分子之和除以分母之和，不能对组比率取算术平均。人数差很多的组之间，算术平均会把小样本组的比率放大到与大盘相当。判定线索是该列每一行代表一个组，而不是一个个体。
  正例: |-
    三个学院就业率 90%／50%／50%，人数 1000／10／10 → 总体约 88%，不是 63%
  反例: 若每一行就是一个个体，该比率列可以直接求均值
  来源: 统计学基本口径
  权威度: 行业
  核验状态: 待核对
- id: general-small-n-unstable
  标题: 小样本分组的比率不可靠
  类别: 口径规则
  适用学科: 通用
  适用字段: []
  触发条件: 分组后某组样本量很小，例如少于 30
  规则内容: |-
    样本量很小的分组算出的率波动极大 —— 10 个人里 1 个就是 10%，再多 1 个就变 20%。直接按比率排名会让这些小组排在最前或最后，看起来像发现了规律，其实只是随机波动。应同时给出各组样本量，或在样本量过小时改报原始计数。
  正例: 某学院 8 人、就业 1 人 → 报「1／8」而不是「12.5% 的就业率」
  反例: 样本量 5000 的组，比率差异主要来自真实差异而不是波动
  来源: 统计推断的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-percentage-sum-not-100
  标题: 百分比之和不等于 100 的成因
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 比例
  - 占比
  - 百分比
  触发条件: 该列的百分比之和明显不等于 100
  规则内容: |-
    百分比加起来不等于 100 有四种常见成因：多选题的分母是人数而选项可多选、四舍五入的累积误差、存在缺失或「未回答」未计入、分母口径不一致（用行数做分母却只对非缺失求和）。四者处理方式不同——多选题本就不该加到 100，而分母不一致是真的错误。其中逐项四舍五入造成的差额要说明来源，或用最大余数法分配，不要硬改某一项去凑总数。
  正例: 多选题各选项占比之和 180% → 正常，一人可选多项
  反例: 单选题各选项占比之和 96% → 需查是否漏计缺失，或分母用错
  来源: 问卷数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-composition-vs-rate
  标题: 构成比不能当率用
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 占比
  - 构成
  - 比例
  - 率
  - percent
  - rate
  触发条件: 该列语义是某部分占总体的比例，但被用来描述发生风险
  规则内容: |-
    构成比的分母是总体，率的分母是可能发生该事件的人群。把构成比当率会得出方向性错误的结论 —— 某类人群在事件总数里占比高，不等于该类人群的事故率高，该组规模大时构成比自然高。判定线索是看分母是否包含了「本来就无风险」的人。
  正例: 事故构成比的分母是全部事故数，事故率的分母是暴露人时，两者不可互换
  反例: 若分母确实只含风险人群，该比例本身就是率，可以直接解读
  来源: 统计指标口径的通用约定
  权威度: 行业
  核验状态: 待核对
- id: general-percentage-points
  标题: 百分点与百分比不是一回事
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 变化
  - 增幅
  - 增减
  - 差值
  - change
  触发条件: 该列描述比例的变化量，但未说明是绝对差还是相对变化
  规则内容: |-
    从 10% 升到 15% 是上升了 5 个百分点，也可以说是上升了 50% —— 两种表述都常见，混用会得出完全不同的量级。判定线索是描述比例变化却只写上升多少百分比、未说明基准。报告里必须写清是百分点还是百分比。
  正例: 「上升 5 个百分点」或「相对上升 50%」，两者分开表述
  反例: 不是比例的量（如收入）其变化只能按百分比说，不存在百分点问题
  来源: 统计指标口径的通用约定
  权威度: 行业
  核验状态: 待核对
- id: general-age-standardization
  标题: 年龄结构不同时分组率不可直比
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 率
  - 比例
  - 患病率
  - 死亡率
  - rate
  触发条件: 需要比较两个年龄结构差异很大的群体的比率
  规则内容: |-
    一个群体老年人多、另一个年轻人多时，粗率会因年龄结构不同而不可比 —— 即使两组各年龄段的率完全相同，总体率也会不同。比较此类率需做年龄标准化，或分层后逐层比较。判定线索是两组的中位年龄或年龄分布明显不同。
  正例: 两组年龄结构差异大 → 报标准化率，或分层报告
  反例: 年龄结构接近时粗率可直接比较，不必强制标准化
  来源: 统计指标口径的通用约定
  权威度: 行业
  核验状态: 待核对
- id: general-nominal-vs-real-amount
  标题: 跨年比较金额要区分名义与实际
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 金额
  - 收入
  - 产值
  - 支出
  - amount
  触发条件: 该列是跨年度的金额，且未标注是否已做价格平减
  规则内容: |-
    跨年比较金额时，含价格变动的名义值与已扣除价格影响的实际值会给出不同结论，甚至方向相反。判断依据是该数据是否注明了「可比价」「不变价」或平减指数。不做区分就断言增长，可能把价格上涨误读成真实增长。
  正例: 两年金额都按同一基期价格平减后再比较
  反例: 同一年内的金额对比不涉及跨期价格问题，无需平减
  来源: 统计指标口径的通用约定
  权威度: 行业
  核验状态: 待核对
- id: general-period-vs-point
  标题: 时期指标与时点指标不能相加
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 人数
  - 数量
  - 存量
  - 流量
  - count
  - 总量
  触发条件: 需要把多个时间点的指标累加或取平均时
  规则内容: |-
    存量是时点值（如年末人口、库存），流量是时期值（如全年出生数、销售额）。时点指标跨期不能相加 —— 年末人口相加没有意义；时期指标则可以累加。判定线索是该指标是否在描述一个区间内累积的量。混淆两者会得到量级明显错误的结果。
  正例: 全年出生数可相加，年末人口不可相加
  反例: 若指标本身就是时期值，累加是正确的做法
  来源: 统计指标口径的通用约定
  权威度: 行业
  核验状态: 待核对
- id: general-yoy-vs-mom
  标题: 同比增长与环比增长不可混用
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 增长率
  - 增幅
  - 同比
  - 环比
  - rate
  触发条件: 该列描述增长率，但未说明比较基期
  规则内容: |-
    同比是与上年同期比，环比是与上一期比，两者在有季节性的数据里差异很大 —— 受假期与季节影响的月份尤其明显。混用或未标注会让结论无法复现。判定线索是数据存在明显季节波动但增长率标成了单一口径。
  正例: 月度数据同时给出同比与环比，并注明比较基期
  反例: 年度数据只有同比一种含义，不存在环比问题
  来源: 统计指标口径的通用约定
  权威度: 行业
  核验状态: 待核对
- id: general-dedupe-scope
  标题: 去重前必须明确唯一键
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 学号
  - 编号
  - id
  - 样本号
  - 身份证
  - 主键
  触发条件: 检出完全重复的行，需要判断它是真实观测还是录入错误
  规则内容: |-
    「什么算重复」取决于业务唯一键：身份证相同是同一个人，而受访者在不同时点的记录本就应该有多条。不明确唯一键就去重，会把面板数据压成截面数据，或误删真实观测。判定不了时必须交用户确认 —— 科研数据里删掉一行真实记录，比留下一条重复危险得多。去重口径必须在报告里写明。
  正例: 面板数据按 学号加轮次 唯一，不按学号单独去重
  反例: 截面数据里学号重复通常就是录入错误，可按学号去重
  来源: 数据清洗通用口径
  权威度: 团队经验
  核验状态: 待核对
- id: general-ranking-ties
  标题: 排名遇到并列值要说明规则
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 排名
  - 名次
  - rank
  - 排序
  触发条件: 该列存在并列值，或需要按某指标生成排名
  规则内容: |-
    并列名次有多种处理方式：跳号、密集、按出现顺序。同一份报告里混用会造成不可比的排名，而各报表工具的默认方式并不相同。判定线索是存在并列值且未注明规则。应在方法里统一声明采用哪一种。
  正例: 统一声明采用密集排名，并保持全文一致
  反例: 指标无并列时排名规则不影响结果
  来源: 数据呈现的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-equal-vs-quantile-bins
  标题: 等距分组与等频分组含义不同
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 分组
  - 区间
  - 档次
  - 等级
  - bin
  触发条件: 需要把连续变量分箱后再统计时
  规则内容: |-
    等距分组保证区间宽度一致但各组人数可能悬殊；等频分组保证各组人数相近但区间宽度不等。两者得出的分布形状完全不同，而「分组」二字不区分它们。判定线索是分组边界是否等间隔。必须在方法里写明用了哪一种，或直接列出边界。
  正例: 说明「按等频分 5 组」，或列出具体边界
  反例: 分组边界恰好既等距又等频时两种口径一致，无需区分
  来源: 统计分组的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-small-cell-count
  标题: 交叉表的小格频数不可解读
  类别: 口径规则
  适用学科: 通用
  适用字段: []
  触发条件: 分组交叉后某些单元格的样本量很小
  规则内容: |-
    交叉表里频数只有几个的格子，其百分比波动极大且容易泄露个体信息。多数期刊要求频数很小的格子合并或不报百分比 —— 这不是格式问题，而是结论可靠性与隐私的双重要求。判定线索是交叉表出现稀疏格子。
  正例: 某格频数为 3 → 合并相邻格，或只报频数不报百分比
  反例: 若交叉结果稀疏但结论只基于边际分布，可不做合并
  来源: 统计报表的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-zero-vs-absent-event
  标题: 计数为 0 不等于没有该记录
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 次数
  - 人数
  - 数量
  - count
  - 频次
  触发条件: 该列是计数，且分布里 0 很多
  规则内容: |-
    计数列的 0 有两种来源：确实发生了 0 次，或该记录未纳入统计。前者是真实观测，后者是结构性缺失。判定线索是 0 是否与某些分组完全对应。把 0 当缺失填掉会低估总量，把缺失当 0 会凭空造出「没有发生」的观测。
  正例: 未参与调查的个体不应记为 0 次，应记为缺失
  反例: 参与了调查且确实没发生的，记为 0 是正确的
  来源: 计数数据处理的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-scale-interval-not-equal
  标题: 定序量表的间距不能假设相等
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 量表
  - 题项
  - 满意度
  - 等级
  - score
  触发条件: 该列是定序量表，且打算计算均值或做回归
  规则内容: |-
    满意度 1-5 里相邻两级之间的心理差距是否相等，在测量学上并无保证，所以严格来说它不满足定距条件。实践中普遍把多个题项加总后近似当作定距，但单题直接做均值需要在方法里说明理由。判定线索是单题是否被直接用于参数统计。
  正例: 多个题项加总成总分后再做参数统计，并说明理由
  反例: 若量表经过等距性检验，单题也可以按定距处理
  来源: 测量学与统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-coverage-rate-denominator
  标题: 覆盖率类指标的分母要对齐
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 覆盖率
  - 普及率
  - 渗透率
  - 率
  - rate
  触发条件: 该列是覆盖率，且需要跨来源或跨组对比时
  规则内容: |-
    覆盖率的分子是被覆盖的对象数，分母是应被覆盖的对象数。不同来源常把分母取成实际参与数，于是覆盖率虚高。判定线索是分母的定义是否包含未纳入统计的对象。跨来源比较覆盖率前必须统一分母口径。
  正例: 覆盖率的分子与分母都限定在同一目标人群内
  反例: 若分母定义在所有来源里都一致，覆盖率可以直接比较
  来源: 统计指标口径的通用约定
  权威度: 行业
  核验状态: 待核对
- id: general-panel-unbalanced
  标题: 面板数据不是每个对象都有每一期
  类别: 口径规则
  适用学科: 通用
  适用字段:
  - 学号
  - 编号
  - id
  - 轮次
  - 年份
  - period
  触发条件: 按对象与期次整理后，各对象的记录条数不一致
  规则内容: |-
    面板数据分平衡与非平衡两类。非平衡本身是正常的（中途退出、某轮未参与），但如果用「各期都有记录」做筛选，会系统性地剔掉退出者，造成幸存者偏差。判定线索是各对象的期次覆盖不齐。是否需要平衡化取决于研究问题，不能默认。
  正例: 保留非平衡结构，在方法里说明缺失的期次与原因
  反例: 若研究要求每个对象都有完整期次，则应说明筛选带来的样本损失
  来源: 面板数据处理的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-case-leading-zero-lost
  标题: 前导零已丢失的补救
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 学号
  - 编号
  - 工号
  - id
  - 样本号
  触发条件: 该列为标识列，取值全为纯数字，且长度不齐
  规则内容: |-
    从 Excel 读取的标识列经常因为被识别成数字而丢掉前导零。判断线索是长度：若该列大多数值长度为 8、个别为 6 或 7，通常说明前导零已丢失。补救方式是按目标长度左补零，而不是当异常值剔除 —— 剔除会直接丢掉整条记录，补零则能救回来。
  正例: 20210001 与 2100002 → 后者按 8 位补成 02100002
  反例: 该列本身长度不固定（如含字母的编号）→ 不能套用补零
  来源: Excel 与 CSV 数据交换的已知行为（标识列被读成数字时丢失前导零）
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-multiselect
  标题: 多选题被拆成多个 0/1 列
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 出现若干列名相似、取值只有 0 和 1 的列
  规则内容: |-
    多选题导出时常被拆成一列一个选项。这些列之间不独立，不应各自当作独立的二分类变量做分布统计。另外，这类列里的 0 与空白含义不同：「没勾选」和「未回答」是两回事，把空白当 0 处理会凭空造出一批「未选择」的样本。
  正例: 爱好_篮球、爱好_足球 等一组列 → 多选列，需合并考虑
  反例: 单独的「是否吸烟」0/1 列 → 是真正的二分类变量，正常统计
  来源: 问卷数据导出的常见形式（多选题被拆成一组 0/1 列）
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-zero-variance
  标题: 零方差列未必该删
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 某列所有非缺失值完全相同
  规则内容: |-
    零方差列对分析没有信息量，但它本身可能有意义 —— 例如全表省份都是「北京」，因为这份数据本就是北京地区的样本。不应自动删除，应先确认是数据本身如此，还是筛选条件过窄或抽样出了问题。
  正例: 「省份」列全是北京，且数据集说明本就是北京样本 → 正常
  反例: 「省份」列全是北京，但数据声称来自全国 → 抽样有问题，需报告
  来源: 统计数据清洗的通用口径
  权威度: 行业
  核验状态: 待核对
- id: general-case-column-rename-across-waves
  标题: 多轮数据的列名改过或含义变了
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 纵向合并两份数据时列名能对上，但行数或分布异常
  规则内容: |-
    同一调查不同轮次之间列名可能被改过（「受教育程度」改成「学历」），也可能列名没变但含义变了（「收入」从月收入改成月收入的对数值）。前者对不上而合并出两倍的列，后者更危险 —— 能对上，但量纲已经变了，合并后分布出现两个相距很远的峰。合并前必须逐列核对定义，不能只看列名相同。
  正例: 两轮列名不同但定义一致 → 统一列名后合并
  反例: 列名相同但一轮是原始值、一轮是对数值 → 不能直接合并，分布会出现双峰
  来源: 纵向数据合并的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-copy-paste-offset
  标题: 复制粘贴错位导致整列偏移
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 某列取值与该列应有的语义明显不符，且相邻列取值顺次像是它
  规则内容: |-
    在电子表格里筛选后复制、或从合并单元格区域复制，常造成整列相对其他列错开一行或多行。表现很典型：该列的值看着属于相邻列，且从某一行起整体偏移，错位点前后它与相邻列的关系突然改变。这类问题必须回到原始导出重做，不要按值去猜着修。
  正例: 「年龄」列从第 80 行起装着「学历」的值 → 整列偏移，需回原始文件重导
  反例: 只有少数几行取值异常而其余正常 → 更可能是录入错误，不是整列偏移
  来源: 数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-hidden-rows-dropped
  标题: 隐藏行与筛选状态下的复制
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 行数比预期少，且缺失的行序不连续
  规则内容: |-
    在被筛选或手动隐藏行的表格上做全选复制，只会复制可见行，隐藏行不会进来。得到的数据行数偏少、行序有跳跃，而且没有任何报错提示。判定线索是行数比数据提供者声称的少。必须要求对方先清除筛选与隐藏再导出。
  正例: |-
    原表 500 行但筛选后剩 120 行 → 复制得到 120 行，丢掉 380 行
  反例: 数据本身就只有部分记录（如只收集到部分样本）→ 不是隐藏行造成的
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-same-name-not-same-person
  标题: 同名不代表同一个人
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 姓名
  - 名字
  - name
  触发条件: 打算以姓名作为跨表合并的键
  规则内容: |-
    用姓名做合并键会把不同的人对到一起 —— 同名在同一样本里并不罕见，改名与生僻字异体写法又会让同一个人拆成两条。跨表匹配应优先用学号、身份证这类唯一标识；只能靠姓名时，必须同时匹配性别、出生日期等辅助字段，并把未能唯一匹配的记录单独列出人工确认。
  正例: 姓名加出生日期组合匹配，仍不唯一时交人工确认
  反例: 仅凭姓名相同就判为同一人 → 同名者会被错误合并
  来源: 跨表匹配的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-batch-sheets-unequal-columns
  标题: 同表分批导出各 sheet 列不一致
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 同一文件的多个 sheet 看着是同一张表，但列数或列名有出入
  规则内容: |-
    数据常按批次、月份或部门分成多个 sheet，看着结构相同，实际某几个 sheet 少一列、列序不同、或同一列名大小写不同。直接纵向拼接会错列或凭空多出空列。合并前必须逐 sheet 核对表头，列不一致时先按列名对齐再拼。
  正例: 三个 sheet 表头完全一致 → 可安全纵向拼接
  反例: 某 sheet 多了「备注」列且列序不同 → 必须先按列名对齐，不能按位置拼
  来源: 数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-overlapping-sources
  标题: 两份来源有重叠样本
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 学号
  - 编号
  - 身份证
  - id
  - 样本号
  触发条件: 合并两份来源的数据后，行数少于两份之和
  规则内容: |-
    从两个系统各导一份再合并时，同一批记录可能同时出现在两边（部分重叠），也可能字段互补（需要按标识列连接而不是纵向拼接）。判定线索是合并后行数少于两边之和、且标识列有交集。必须先明确两份数据的关系是互补还是重叠，再决定连接还是拼接。
  正例: 两表标识列有 40% 交集 → 重叠，应按标识列做连接而非拼接
  反例: 两表标识列完全无交集 → 是两组不同样本，纵向拼接即可
  来源: 多来源数据合并的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-date-column-half-text
  标题: 日期列一半是文本一半是日期值
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 日期
  - 时间
  - date
  - time
  - 年月日
  触发条件: 日期列的类型不一致，部分取值能解析成日期、部分不能
  规则内容: |-
    手工录入的日期列常一半是真正的日期值、一半是文本（「2024年1月2日」「1/2/2024」「20240102」混在一起）。类型推断会因少数文本把整列判成文本，于是排序按字典序把 1/10 排到 1/2 前面。必须先统一解析再排序，无法确定格式的交人工确认，不要默认某一种约定。
  正例: 同一列统一成 2024-01-02 之后再排序
  反例: |-
    同一列里既有斜杠格式又有中文格式 → 与日期多义那条的边界在于：本条讲的是类型不一致导致排序错乱，格式统一而只是月日顺序不明则属那一类
  来源: 日期解析的通用问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-codebook-version-mismatch
  标题: 码表版本与数据不匹配
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 学历
  - 专业
  - 行政区划
  - 民族
  - 行业
  - 职业
  - 性别
  触发条件: |-
    按现有码表解读编码列时出现大量码表里没有的码值，或同一列里出现语义重复的成对取值
  规则内容: |-
    编码列的码值必须与该批数据当期的码表对应。用新码表读旧数据（或反之）会得到一批查无此码的值，而对照错了码表比查不到更危险 —— 它会给出一个看似合理但完全错误的类别名。同一批数据里混了两个版本时，表现是类别数比应有的多、且存在语义重复的取值，此时要按数据来源年份分别对照码表。判定线索是出现码表未收录的码值，或某些码值对应的类别与取值内容明显矛盾。
  正例: 出现码表未收录的码值 → 先确认数据年份与码表版本
  反例: 少数未收录码值可能是缺失编码（如 9、99），先排除再怀疑版本问题
  来源: 编码标准存在版本差异这一已知事实（具体标准号与码值待团队对照原文）
  权威度: 行业
  核验状态: 待核对
- id: general-case-cartesian-join
  标题: 合并产生笛卡尔积导致行数暴增
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 学号
  - 编号
  - id
  - 主键
  - key
  触发条件: 合并两份表后行数远多于任意一份
  规则内容: |-
    当合并键在任一侧不唯一时，连接会按组合展开 —— 左表 3 条同键记录与右表 4 条同键记录会得到 12 行。行数在合并后暴增是最典型的信号，但常被误认为「数据变多了」。合并前必须确认键在两侧都唯一，或明确按多对多展开并说明后果。
  正例: 合并前检查键的唯一值数是否等于行数
  反例: 多对多连接本身是合法需求（如学生与课程），此时行数增加是预期内的
  来源: 跨表合并的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-join-key-type-mismatch
  标题: 合并键两侧类型不一致
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 学号
  - 编号
  - id
  - 主键
  - key
  触发条件: 合并后匹配率为 0 或极低，但两侧键的取值看起来相同
  规则内容: |-
    一侧被读成数值、另一侧是文本（或一侧带前导零、另一侧没有），键看起来一样却匹配不上。表现是匹配率接近 0、或匹配后大量字段为空。判定线索是抽样对比两侧键的字符串长度与首字符。合并前统一类型并按文本比较是稳妥做法。
  正例: 两侧都按文本、去空白后比较
  反例: 若两侧键确实语义不同（一个是学号一个是工号），匹配率低是正常的
  来源: 跨表匹配的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-vlookup-approximate
  标题: 近似匹配导致错行对齐
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 用查找函数匹配后，部分行的结果明显属于别的记录
  规则内容: |-
    表格查找函数在未显式指定精确匹配时会用近似匹配，需要先对首列排序才「大致可用」，而中文字段的排序结果往往不是预期顺序，于是匹配到相邻的错误行。表现是少量行取到了别人的值，且看起来还算合理。判定线索是错配的行在查找列上取值相邻。
  正例: 显式指定精确匹配，并把未匹配项单独列出核对
  反例: 区间查找（如按分数段定等级）本来就需要近似匹配，此时排序是必须的前提
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-merge-missing-jump
  标题: 合并后缺失率骤增
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 连接后某些列缺失率从接近 0 变成很高
  规则内容: |-
    连接后来自另一侧的字段出现大量空值，通常不是数据缺失，而是键没匹配上。此时把它当缺失去填补或删行，会把「没匹配上」这个真问题掩盖掉。判定线索是缺失集中在来自另一侧的列上，且与原表的缺失率差异巨大。
  正例: 先查匹配率，未匹配的记录单独输出核对
  反例: 若另一侧本来就有大量缺失，合并前后的缺失率应当接近，不是本条
  来源: 跨表合并的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-unit-conversion-direction
  标题: 单位换算方向搞反
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 金额
  - 重量
  - 长度
  - 剂量
  - 距离
  - amount
  触发条件: 换算后的数值量级异常，或前后恰好差一个固定倍数
  规则内容: |-
    把万元换算成元应乘以一万，方向搞反就变成除以一万，量级差一亿倍；而每一行仍然看起来是合理数字，不会有异常值告警。判定线索是换算前后数值恰好差一个固定倍数。换算后应与已知量级做一次抽查。
  正例: 换算后抽查一条记录与常识量级比对
  反例: 若换算倍数为 1（同名单位），换算无效果也看不出问题
  来源: 科研数据整理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-sample-size-unexplained
  标题: 清洗前后样本量对不上
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 报告里的样本量与原始数据行数不一致，且差异无法解释
  规则内容: |-
    清洗会删行（重复、异常、缺失），但每一类删了多少必须可追溯，否则读者无法判断结果是否受选择性删除影响。判定线索是清洗前后的行数差与各项处理记录对不上。这类差异在评审时是硬伤 —— 无法复现的删除等于结果不可信。
  正例: 处理日志逐项记录：重复删除 N 条、缺失删除 M 条、最终 K 条
  反例: 若清洗未删除任何行，前后样本量应当相等
  来源: 数据处理留痕的通用要求
  权威度: 行业
  核验状态: 待核对
- id: general-case-file-version-chaos
  标题: 中间文件版本混乱
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 目录里存在多个同义文件名，如最终版、最终版2、修改后
  规则内容: |-
    多人协作时中间文件常堆积出多个版本，无法判断哪一份是当前口径，后续处理可能建立在过期文件上。判定线索是文件名带版本词但没有日期与说明。应以数据指纹（行数、列数、关键统计量）标注每一版，并在日志里记下用的是哪一版。
  正例: 文件名带日期与处理摘要，或记录每版的数据指纹
  反例: 若项目用版本控制管理中间产物，文件名无需承载版本信息
  来源: 科研数据管理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-manual-fix-no-record
  标题: 手工改过的单元格没有留痕
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 数据里出现若干看似被改过的值，但无任何修改记录
  规则内容: |-
    直接在电子表格里改错值是最常见的操作，也是最难追溯的 —— 改动不留痕，之后无人能分清哪个值是原始录入、哪个是人工判断后改的。判定线索是若干取值与该列其余取值的风格不一致。必须要求改动写进处理日志，并注明原值与理由。
  正例: 修改记录写明原值、新值、依据与时间
  反例: 由脚本完成的、可复现的批量处理不属于手工改动
  来源: 科研数据管理的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-duplicate-by-spelling
  标题: 同一实体因写法不同未被识别为重复
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 单位
  - 姓名
  - 地址
  - 机构
  - 名称
  - name
  触发条件: 精确去重后仍发现疑似同一实体的多条记录
  规则内容: |-
    全角半角、多余空格、简称全称、个别字差异都会让同一实体看起来不同，精确匹配的去重抓不到它们。表现是去重后仍有肉眼可见的重复。判定线索是去重后的记录数仍明显偏多，且存在字面高度相似的取值。需要相似度匹配筛出候选、再由人工确认，不能自动合并。
  正例: 相似度筛出候选对，人工逐条确认后合并
  反例: 字面相似不代表同一实体（同名不同人），自动合并会破坏数据
  来源: 跨表匹配的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-delimiter-not-comma
  标题: 分隔符不是逗号
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 读进来只有一列，而每行内容像是多个字段连在一起
  规则内容: |-
    部分导出文件用分号或制表符作分隔符（受区域设置影响）。按逗号解析会得到一列，且整行内容被视为一个字段，看起来像是列名很长。判定线索是只解析出一列、而该列取值里含大量分隔符。读取前应先探测分隔符。
  正例: 探测到分号后按分号解析，得到预期的多列
  反例: 若整份数据确实只有一列（如一行一个文本），不是分隔符问题
  来源: CSV 格式的已知解析行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-trailing-delimiter
  标题: 行尾多余分隔符造出空列
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 读进来比表头多出一列，且该列全为空
  规则内容: |-
    导出时在每行末尾多写一个分隔符，会解析出一个无名的空列。它会让列数与表头不符、影响按位置取列的逻辑，并在列名匹配时产生一个空列名。判定线索是多出的列全部为空且没有对应表头。
  正例: 检出末尾空列后剔除，并检查是否所有行都如此
  反例: 若某列确实存在但整体缺失，它应当有表头，不是本条
  来源: CSV 格式的已知解析行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-formula-range-shift
  标题: 公式填充范围错位
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 某列的取值与前一行或邻近列呈现固定的错位关系
  规则内容: |-
    手工填充公式时引用未锁定、或填充范围少一行多一行，会造成整段结果错位 —— 例如总分列从某行起算的是上一行的数据。表现是该列与原始列的相关性从某一点起突变。判定线索是错位点前后关系改变，且错位量恒定。
  正例: 逐行核对公式的引用区域，或改用可复现的脚本重算
  反例: 若错位量不固定，更可能是数据本身的问题而不是公式
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-multi-source-unit-different
  标题: 两个来源同一字段用了不同单位
  类别: 清洗案例
  适用学科: 通用
  适用字段:
  - 金额
  - 重量
  - 长度
  - 面积
  - amount
  触发条件: 合并两个来源后，该列分布出现两个相距固定的簇
  规则内容: |-
    两个系统对同一字段可能用不同单位（一个元一个万元，一个克一个千克），合并后分布出现双峰且两峰相距恰好是换算倍数。判定线索是双峰的比值是 10 的整数次幂。不换算直接统计会同时污染均值与分位数。
  正例: 确认来源后统一到同一单位再合并
  反例: 分布双峰也可能是两个真实子群体的差异，先确认是否为整数倍再判定
  来源: 多来源数据合并的常见问题
  权威度: 团队经验
  核验状态: 待核对
- id: general-case-filter-then-stats
  标题: 筛选状态下做的统计掩盖了整体
  类别: 清洗案例
  适用学科: 通用
  适用字段: []
  触发条件: 交付的统计结果与重新计算的整体结果对不上
  规则内容: |-
    在筛选或隐藏行的状态下用表格函数做的汇总，只统计可见行，提交时却不带任何标注。表现是各项统计量与整体数据都对不上，差值恰好等于被隐藏的部分。判定线索是汇总结果与整体重算的差异恒等于某个子集。应在清除筛选的状态下重算全部统计量。
  正例: 在清除筛选的状态下重算全部统计量
  反例: 分组的统计本来就应该只统计该组，不是本条
  来源: Excel 数据交换的已知行为
  权威度: 团队经验
  核验状态: 待核对
