- id: ds-missing-sentinel-in-model
  标题: 哨兵值与真实负值混用
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 盈亏
  - 差额
  - 增减
  - 收益
  - 年龄
  - age
  触发条件: 该列既有真实负数，又有作为缺失编码的负数
  规则内容: |-
    同一列里真实负值与缺失哨兵值混在一起时，单看数值无法区分 —— 「-1」既可能是真实的负一，也可能是「未回答」。判定线索是该列的负数集中在少数几个整齐取值上，而其余负数分布是连续的。必须先对照该数据集的码表把这些取值分出来，再决定谁进统计。
  正例: 盈亏列出现 -1，而其余取值连续分布 → 需查码表确认 -1 是亏损还是未回答
  反例: 若整列的负数都连续分布、没有集中在少数取值上，说明没有哨兵值，不适用本条
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: ds-label-positive-class
  标题: 二值字段的方向必须写明
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 标签
  - label
  - target
  - y
  - 结果
  - 状态
  触发条件: 该列只有两个取值，但没有任何地方声明哪个表示「发生」
  规则内容: |-
    二值字段的取值方向决定了所有后续分组与解读的方向，而 0 与 1、是 与 否、阳性与阴性的对应关系在不同数据集里可能相反。判定线索是该列只有两个取值、但字段说明里没有声明哪个是「发生」。必须显式声明并写进数据说明，否则任何按该字段分组的结论都可能整体反了。
  正例: 明确声明该列 1 表示「发生违约」
  反例: 三分类及以上的字段不存在单一方向定义，应按每类分别说明
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: ds-student-status-timeline
  标题: 学籍状态是时间序列而非单一取值
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 学籍状态
  - 学籍状况
  - 在读状态
  - status
  - 学籍异动
  触发条件: 同一学生在学籍表中出现多行，或同一行里出现「在籍/休学/复学/退学」等多种状态
  规则内容: |-
    学籍状态描述的是学生在某一时间段内的状态，不是一列静态属性，会随学籍异动变化，因此同一学生在整个在校期间可能对应多行记录，每行各有生效起止时间。脏法有两种：一是把状态存成单列、后一次异动覆盖前一次，历史丢失，二是多行并存但没有起止时间，无法判断哪条是当期。判定线索是同一学号出现多行而缺少生效时间字段。统计在校人数时必须先折算到某个时点，取该时点上唯一生效的状态，不能直接把行数当人数。
  正例: 按「学号 + 生效日期」取某统计时点上唯一生效的状态，再计数
  反例: 若表里每个学号只有一行且状态列自带起止时间，则不存在状态覆盖问题
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-term-year-encoding
  标题: 学年与学期编码跨系统不统一
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 学年
  - 学期
  - 开课学期
  - academic_term
  - 学年学期
  触发条件: 同一学年的学期在教务、学工、财务等系统里的编码形式不同
  规则内容: |-
    学年学期有至少四种常见写法：「2023-2024学年第一学期」（两段学年 + 中文学期）、「2023-2024-1」（中划线段 + 数字学期）、「231」（两位学年 + 一位学期）、「2023秋」（学年 + 季节）。它们在各自系统内自洽，但拼到一张表里无法直接比较，按字符串排序会得到错误的时间顺序（「2023秋」与「231」互相排不出先后）。判定线索是同一列里出现两种以上写法，或取值长度不一致。跨系统汇总前必须先归一到一个规范形式，并把归一映射写进数据说明。
  正例: 先归一为「学年起年 + 学期序号」的整数编码，再排序或分组
  反例: 单一系统内部导出、取值写法唯一时可直接使用，不必归一
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-grade-marker-special
  标题: 成绩列里的非数值特殊标记
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 成绩
  - 分数
  - 考核成绩
  - score
  - grade
  - 总评成绩
  触发条件: 成绩列本应是数值，却出现缓考、免修、作弊、缺考等文字标记
  规则内容: |-
    成绩列在教务系统里往往不是纯数值列：缓考、免修、免听、作弊、违纪、缺考、未参加、待录入等状态会与百分制分数混排在同一列。这些标记有两种存法：一是文字（如「缓考」），二是借用了固定数值（如用 -1 表示缺考、用 0 表示未录）。脏法在于后一种：标记值会被当成真实分数参与平均分与绩点计算，把整体拉低。判定线索是该列既有超出百分制范围的取值，也有聚集在少数整齐取值上的异常值（大量正好 0 分往往不是真考 0 分）。计算均分前必须先按码表把这些标记分离出来，并明确它们是否计入统计分母。
  正例: 先分离出「缓考/缺考」等标记，再对真实分数求均分并说明分母口径
  反例: 若该列已拆成「成绩数值」与「成绩标记」两列，则不存在混排问题
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-transcript-revision-flag
  标题: 重修与补考后的成绩替换规则
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 成绩
  - 修读类型
  - 是否重修
  - remark
  - 成绩备注
  - 替代成绩
  触发条件: 同一学生对同一门课程有多条成绩记录
  规则内容: |-
    同一学生同一课程出现多条成绩是正常现象，来自补考、重修、以及跨学期重复选课，但「以哪条为准」不同学校不同：有的取最高一次、有的取最后一次、有的把曾不及格一并计入不及格门次统计。若表里只是多行并列而没有「修读类型」或成绩替代标记，直接按行去重会随机保留一条，结论不可复现。判定线索是（学号，课程号）组合出现重复行。统计前必须先确认该校的成绩替换口径，并把它写进数据说明，否则同一份表算出两套结论。
  正例: 显式声明「按最后一次修读取成绩」，据此在重复行中选取
  反例: 若课程号带了学期后缀因而每门课唯一，则不需要替换规则
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-float-accumulation
  标题: 大规模浮点求和的累积误差
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 金额
  - 数量
  - 合计
  - sum
  - amount
  触发条件: 需要对大量浮点数求和或求平均，且结果与逐项核对的精确值不一致
  规则内容: |-
    浮点表示有精度上限，累加几十万条时误差会累积到可见程度，分项之和与总和对不上是常见现象。判定线索是元素数量很大而数值跨度也大。金额这类要求精确的场景应用定点数或整数分单位表示，不要用浮点存金额。
  正例: 金额以「分」为单位的整数存储与统计
  反例: 元素数量少且量级接近时误差可忽略，不必改造
  来源: 数值计算的通用约定
  权威度: 行业
  核验状态: 待核对
- id: ds-gpa-scale-caliber
  标题: 绩点换算口径必须声明
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 绩点
  - 平均绩点
  - GPA
  - gpa
  - 学分绩点
  - 加权平均分
  触发条件: 由百分制成绩推算绩点或平均绩点
  规则内容: |-
    百分制到绩点没有统一算法：有「每分递减」的连续公式，有「60 分以下为 0、60 分对应 1.0 后每分递增」的分段公式，也有按等级（优良中及格）映射到 4.0 或 5.0 制。同一批成绩在不同公式下算出的平均绩点能差出零点几，跨校或跨学院比较会失真。此外还有加权与不加权的分歧：按学分加权才算真正的平均绩点，直接对课程成绩求算术平均是另一种指标。判定线索是出现「平均绩点」但数据说明里没有给换算公式与满分制。使用前必须拿到该校的换算表，并把满分制（4.0 还是 5.0）一并记录。
  正例: 注明「按 4.0 制、学分加权」并附换算表，再使用绩点列
  反例: 若只比较同一份表内部的名次，换算公式的影响相对一致，但仍不该跨表比较
  来源: 统计分析通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-credit-accounting-caliber
  标题: 学分统计是否含重修与免修
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 学分
  - 已获学分
  - 总学分
  - credit
  - credits
  触发条件: 统计学生已获学分或专业总学分
  规则内容: |-
    「已获学分」有三种口径：按修读课程累加（重修会重复计）、按通过的课程计（不及格不计、重修只计一次）、以及计入免修与学分认定（转专业、交换、证书抵免）。三种口径在有无重修、有无免修的学生身上会得出不同数字。判定线索是「已获学分」与按课程明细累加的结果对不上。核对时应拿明细重算一遍，确认当前列用的是哪种口径，并把口径写进说明；特别是毕业审核这类场景，必须与教务口径一致，不能自行按明细重算。
  正例: 以教务口径为准，并用课程明细重算一次核对差异来源
  反例: 若学生没有重修与免修记录，三种口径结果一致，无需区分
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-enrollment-base-caliber
  标题: 在校生数的时点与分母口径
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 在校生数
  - 招生数
  - 毕业生数
  - 学年初
  - 统计时点
  触发条件: 统计在校生数、招生数、毕业生数等规模类指标
  规则内容: |-
    规模类指标的差异主要来自两点：时点与分母。时点上，有「学年初」与「学年末」两种，休学、复学、转入转出发生在学年中途，不同时点取数结果不同，且统计口径要求各异：有口径要求休学学生仍计入在校生，有的要求剔除。分母上，生均经费、师生比这类指标的「生」是按自然人数还是按当量学生数（折算）算，结果差别很大。判定线索是同一指标在两份报表里对不上，而这种差异恰好能用时点或口径差异解释。引用外部数据时必须同时记录时点与分母定义，否则数字无法复核。
  正例: 写明「学年初、自然人数、含休学」，使指标可被复现与对比
  反例: 同一学校同一时点、同一口径下取数不会产生差异，无需额外处理
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-grade-curve-rounding
  标题: 成绩核算的进位与截断口径
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 成绩
  - 平均分
  - 总评成绩
  - 最终成绩
  - score
  触发条件: 对多项成绩加权汇总后需要取整或保留固定位数
  规则内容: |-
    总评成绩由平时、期中、期末按权重合成后，尾数的处理方式会影响是否达到及格线：四舍五入、向上取整、向下取整、只保留整数、保留一位小数，五种做法在临界值（如 59.5）附近给出不同结果，直接决定学生通过与否。多层计算时是先各自取整再汇总、还是全程保留精度最后取一次整，结果也不同。判定线索是成绩分布里出现 59、60 的堆积，或手工重算与系统结果差 0.5 分。复现成绩时必须在数据说明里写明进位规则与取整时机，不能默认四舍五入。
  正例: 全程保留算术精度，仅在输出最终成绩时按教务规则取整
  反例: 若成绩本身以整数录入且不再做加权计算，不存在进位问题
  来源: 统计报表的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-case-partition-key-format
  标题: 分区键格式不一致导致漏读
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 日期
  - 分区
  - partition
  - dt
  - date
  触发条件: 按分区路径读取数据时，部分日期的数据缺失或读不到，且不报错
  规则内容: |-
    分布式存储常按日期分区，而分区键格式在不同批次间可能变化 —— 有补零与无补零、带横杠与不带。表现是某些天的数据读不到，或读到的是零行。判定线索是分区名格式不统一。读取前应枚举实际分区名，而不是按模板拼路径。
  正例: 先列出实际分区名，再按清单读取
  反例: 分区名格式统一时按模板拼路径是可靠且高效的
  来源: 大数据工程实践的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-row-order-not-guaranteed
  标题: 分布式处理的输出顺序不保证
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段: []
  触发条件: 后续步骤依赖查询结果的返回顺序，或按行号与其他数据对齐
  规则内容: |-
    并行处理后结果的顺序默认不保证，同一份查询两次运行的顺序可能不同。若后续按位置而非按键去对齐数据，会产生随机错位，而且每次跑的结果都不一样。判定线索是同一份逻辑的结果行序在两次运行间发生变化。应显式按稳定键排序，或用键做连接。
  正例: 显式按稳定键排序，或用键连接而不是按位置对齐
  反例: 单机单线程读取同一文件时顺序是稳定的
  来源: 大数据工程实践的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-convenience-sampling
  标题: 便利抽样造成的选择偏差
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段: []
  触发条件: 数据来自线上日志或自愿填报，而结论要推广到全体
  规则内容: |-
    线上行为数据只覆盖使用该渠道的人群，自愿填报名单只覆盖愿意参与的人，这类样本与目标总体在结构上不同，直接算出的比例不能代表总体。判定线索是进入样本的机制本身与所研究的特征相关。应报告样本来源并明确适用范围。
  正例: 报告「本结论适用于该渠道活跃用户」，不推广到全体
  反例: 若抽样机制与研究特征无关（如随机抽号），样本可代表总体
  来源: 抽样调查的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-case-log-timezone
  标题: 日志时间戳的时区不统一
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 时间
  - 时间戳
  - 创建时间
  - updated_at
  - timestamp
  触发条件: 同一张表里不同来源的时间相差整数小时，偏移量恒定
  规则内容: |-
    多服务写入同一张表时，有的按本地时间有的按协调世界时记录，表现是同一条业务链路的时间前后颠倒、耗时算成负数。判定线索是不同来源的记录相差整数小时且偏移恒定。必须先把全部时间统一到同一时区再分析。
  正例: 全部转换为同一时区并标注后再计算链路耗时
  反例: 所有记录都来自同一服务时不存在时区混用问题
  来源: 大数据工程实践的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-nested-null-forms
  标题: 嵌套结构里的空值形态不一
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段: []
  触发条件: 从 JSON 或日志解析出的字段里，空值有多种表现
  规则内容: |-
    嵌套数据里的缺失可能是字段不存在、值为空、空字符串、空数组，或者字面量字符串「null」与「None」。它们在解析后看似都是空，但语义不同，判空逻辑写错会把「确实为空」与「没这个字段」混为一谈。判定线索是该字段的出现频率低于总行数。
  正例: 区分「字段不存在」与「值为空」两种情况
  反例: 扁平表里缺失只有空白一种形态，不涉及本条的区分
  来源: 半结构化数据处理的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-upstream-schema-change
  标题: 上游改结构导致下游静默错位
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段: []
  触发条件: 例行任务某天的结果突然异常，而下游代码未改动
  规则内容: |-
    上游表新增或调整了列，若下游按列位置取数，取到的就变成了别的列，而且不会报错 —— 表现是数值列里出现了文本，或统计量整体漂移。判定线索是异常恰好从某一天开始、且上游当天有变更记录。取数必须按列名而不是按位置。
  正例: 按列名取数，缺列时显式报错
  反例: 上游结构未变时，按位置取数与按列名取数等价
  来源: 数据管道的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-course-code-revision
  标题: 课程号跨年改版导致同名不同号
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 课程号
  - 课程代码
  - course_id
  - 课程编号
  - 课程名称
  触发条件: 同一门课程在不同学年出现不同课程号，或同一课程号对应了不同课程名
  规则内容: |-
    培养方案修订时课程会换号：课程内容不变但代码升级，或者两门课合并成一条新代码，或者同一代码在新方案里换了名称与学时。表现是按课程号逐年统计时，某门课在改版那年「消失」又「新增」，而按课程名统计时又出现同名不同号被拆成两门。判定线索是课程号或课程名的对应关系（一对多）在不同学年不一致。跨年比较前应维护一份课程映射表，明确改版前后的对应关系，再按映射后的稳定键统计；直接按课程号做多年趋势会得出课程被取消又重新开设的假象。
  正例: 建课程映射表把改版前代码归并到稳定键，再统计多年选课人数
  反例: 只统计单个学年时不存在跨年改版问题，可直接用课程号
  来源: 数据管道的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-instrument-range
  标题: 实验数据超出仪器量程的取值
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 测量值
  - 读数
  - 量程
  - measurement
  - 仪器
  - 值
  触发条件: 实验测量列出现超出该仪器量程的取值，或所有测量值整齐地等于上下限
  规则内容: |-
    仪器有量程上限与下限，超量程时真实值读不出来，设备有的报错、有的饱和输出（直接给出满量程值），有的记成负值或极大值。表现是一批测量值里出现大量正好等于量程边界的数，或者出现物理上不可能的负值。这类值是「量程截断」的产物，不是真实测量结果，混进统计会低估波动并把均值拉向边界。判定线索是取值在量程边界或物理不可能区间上堆积。处理前必须对照仪器量程与实验记录，把这些取值标为无效或按删失数据处理，不能当普通离群值一删了之。
  正例: 对照仪器量程把饱和值标为超量程无效，按删失口径处理
  反例: 若测量值都落在量程中段且分布连续，说明未触顶，不需要本条处理
  来源: 测量学与统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-case-repeat-measurement-id
  标题: 重复测量的编号与批次丢失
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 测量编号
  - 重复序号
  - 批次
  - run_id
  - sample_id
  - 样本编号
  触发条件: 同一试样有多次重复测量，但表中缺少区分重复次与试样的标识
  规则内容: |-
    实验数据常对同一试样做多次平行测量，按批次还分多次上机。若表里只记录测量值而没有「试样编号 + 重复序号 + 批次」这三层标识，数据落到同一列后无法区分：同一试样的重复测量看起来像不同试样，不同批次的环境差异又会被误当成试样间差异。判定线索是表中行数远多于试样数，而没有能标记重复与批次的列。分析前应先从实验记录本补齐标识；把同试样重复测量当成独立样本会低估测量误差，而忽略批次会把批次误差算进待研究因素里。
  正例: 补齐试样编号、重复序号、批次三层标识，再区分组内与组间变异
  反例: 若每个试样只测一次，不存在重复编号缺失的问题
  来源: 测量学与统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-case-lab-timestamp-batch
  标题: 实验记录时间与批次字段不一致
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 实验时间
  - 记录时间
  - 批次
  - batch
  - 上机时间
  - 采样时间
  触发条件: 实验记录的时间与批次编号对不上，或同一批次跨越不合理的时间跨度
  规则内容: |-
    实验数据一般由系统自动打时间戳，同时人工填批次号，两者由不同流程产生，因此会出现：批次号按上机顺序编，时间戳却是数据导出或补录的时间；同一批次里混进了跨天甚至跨周的记录（补录、设备时钟未校准、时区未统一）。表现是按批次分组的测量值方差异常大，或同一批次内时间序与数值走势对不上。判定线索是批次与时间交叉表里出现批次跨度不合理、或批次内时间不单调。分析前应先以人工记录或设备日志校准时间，并明确批次与时间的权威来源是哪一个。
  正例: 以设备原始日志校准时间，并用批次交叉表检查批次内时间是否单调
  反例: 若时间戳与批次由同一系统在同一时刻生成，二者天然一致，不必校准
  来源: 数据处理留痕的通用要求
  权威度: 行业
  核验状态: 待核对
