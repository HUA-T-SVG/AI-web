- id: ds-missing-sentinel-in-model
  标题: 哨兵值与真实负值混用
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 盈亏
  - 差额
  - 增减
  - 收益
  - 年龄
  - age
  触发条件: 该列既有真实负数，又有作为缺失编码的负数
  规则内容: |-
    同一数值可能既是正常观测又是特殊编码，不能用是否为负或是否集中出现来决定。应按字段、来源批次与数据字典识别哨兵值，保留原值和缺失原因；若同一个编码有歧义，先标记待确认，不能批量置空。
  正例: 该批码表明确-1为未回答 → 在指定字段和批次中转换
  反例: 负值连续分布不能排除哨兵值存在，真实-1也不能自动当缺失
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: ds-label-positive-class
  标题: 二值字段的方向必须写明
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 标签
  - label
  - target
  - y
  - 结果
  - 状态
  触发条件: 该列只有两个取值，但没有任何地方声明哪个表示「发生」
  规则内容: |-
    二分类结果需显式记录类别标签和正类定义，0/1的含义以任务说明为准。模型分数还需对应到具体类别；多分类也应声明每个类别与概率列的对应，采用一对其余时仍需定义目标正类。
  正例: 明确声明该列 1 表示「发生违约」
  反例: 多分类并非不需要方向说明；不能因类别超过两个就忽略标签与分数对应
  来源: 数据清洗通用约定
  权威度: 团队经验
  核验状态: 待核对
- id: ds-student-status-timeline
  标题: 学籍状态是时间序列而非单一取值
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 学籍状态
  - 学籍状况
  - 在读状态
  - status
  - 学籍异动
  触发条件: 同一学生在学籍表中出现多行，或同一行里出现「在籍/休学/复学/退学」等多种状态
  规则内容: |-
    学籍状态描述的是学生在某一时间段内的状态，不是一列静态属性，会随学籍异动变化，因此同一学生在整个在校期间可能对应多行记录，每行各有生效起止时间。脏法有两种：一是把状态存成单列、后一次异动覆盖前一次，历史丢失，二是多行并存但没有起止时间，无法判断哪条是当期。判定线索是同一学号出现多行而缺少生效时间字段。统计在校人数时必须先折算到某个时点，取该时点上唯一生效的状态，不能直接把行数当人数。
  正例: 按「学号 + 生效日期」取某统计时点上唯一生效的状态，再计数
  反例: 每个学号仅一行不证明历史完整；需判断本表是时点快照还是完整异动记录
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-term-year-encoding
  标题: 学年与学期编码跨系统不统一
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 学年
  - 学期
  - 开课学期
  - academic_term
  - 学年学期
  触发条件: 同一学年的学期在教务、学工、财务等系统里的编码形式不同
  规则内容: |-
    学年学期编码须依据来源系统定义解析；“231”不能凭外观断定是哪一年哪一学期。跨系统对齐前保留原码，明确起止日期、学年起年、学期编号及暑期学期规则，再建立可追溯映射。
  正例: 先归一为「学年起年 + 学期序号」的整数编码，再排序或分组
  反例: 同一系统写法一致也不证明含义明确，仍需码表；未知短码不能猜测映射
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-grade-marker-special
  标题: 成绩列里的非数值特殊标记
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 成绩
  - 分数
  - 考核成绩
  - score
  - grade
  - 总评成绩
  触发条件: 成绩列本应是数值，却出现缓考、免修、作弊、缺考等文字标记
  规则内容: |-
    成绩里的缓考、缺考、免修、待录入与0分等必须按该校制度和导出码表解释，不能凭0值聚集判为标记。保留数值、状态、修读类型和统计口径；是否进入均分、绩点或分母由有效制度决定。
  正例: 码表确认0为待录入 → 分离状态并按制度统计
  反例: 真实0分不得自动变缺失；已拆列仍需核对状态与数值是否矛盾
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-transcript-revision-flag
  标题: 重修与补考后的成绩替换规则
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 成绩
  - 修读类型
  - 是否重修
  - remark
  - 成绩备注
  - 替代成绩
  触发条件: 同一学生对同一门课程有多条成绩记录
  规则内容: |-
    同一学生同一课程出现多条成绩是正常现象，来自补考、重修、以及跨学期重复选课，但「以哪条为准」不同学校不同：有的取最高一次、有的取最后一次、有的把曾不及格一并计入不及格门次统计。若表里只是多行并列而没有「修读类型」或成绩替代标记，直接按行去重会随机保留一条，结论不可复现。判定线索是（学号，课程号）组合出现重复行。统计前必须先确认该校的成绩替换口径，并把它写进数据说明，否则同一份表算出两套结论。
  正例: 显式声明「按最后一次修读取成绩」，据此在重复行中选取
  反例: 课程号含学期后缀也不能证明没有同学期补考或重复记录，仍需检查修读与替代关系
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-feature-availability-time
  标题: 特征是否可用要看预测当时
  类别: 数据标准
  适用学科: 数据科学与大数据技术
  适用字段:
  - 特征时间
  - 发布时间
  - 结果时间
  - available_at
  触发条件: 特征对应事件早于预测，但其发布、补录或计算晚于预测
  规则内容: |-
    事件已经发生不代表信息当时已可获得。应为特征记录产生与可用时间，只允许使用预测截点之前已发布的信息；标签形成后才知道的处置结果不能当输入。回测需按当时可见版本构建，而非最终修订版。
  正例: 预测9时需求，只使用9时前已发布的数据，即便昨日统计直到10时才出也不纳入
  反例: 仅检查event_time早于预测不足以排除延迟发布或结果衍生特征
  来源: |-
    scikit-learn 官方文档：Common pitfalls，第12.2节，数据泄漏
    https://scikit-learn.org/stable/common_pitfalls.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: ds-float-accumulation
  标题: 大规模浮点求和的累积误差
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 金额
  - 数量
  - 合计
  - sum
  - amount
  触发条件: 需要对大量浮点数求和或求平均，且结果与逐项核对的精确值不一致
  规则内容: |-
    二进制浮点通常不能精确表示十进制小数，误差与数值、运算及求和方式有关，不只由行数决定。货币若需精确十进制，应使用适当Decimal或最小单位整数，并明确小数位与舍入；整数也要检查范围，Decimal也受精度上下文限制。
  正例: 0.1+0.2可能不严格等于0.3；精确金额按明确精度与舍入规则处理
  反例: 数据少不保证误差总可忽略；展示四舍五入不等于底层已精确
  来源: |-
    Python 官方文档：Floating-Point Arithmetic: Issues and Limitations
    https://docs.python.org/3/tutorial/floatingpoint.html
    Python 官方文档：decimal（十进制精度与舍入）
    https://docs.python.org/3/library/decimal.html
    核对日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: ds-gpa-scale-caliber
  标题: 绩点换算口径必须声明
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 绩点
  - 平均绩点
  - GPA
  - gpa
  - 学分绩点
  - 加权平均分
  触发条件: 由百分制成绩推算绩点或平均绩点
  规则内容: |-
    绩点换算、满分制、课程纳入范围与学分权重均按学校有效制度执行。平均课程绩点与平均百分制成绩不是同一指标，不能互相替代；相同课程排序也不保证不同非线性换算后的总体GPA排名不变。需记录制度版本和处理明细。
  正例: 取得学校换算表后，先计算各课绩点，再按其规定学分和纳入范围汇总
  反例: 不能用“按学分加权才是真正GPA”替代学校定义；同表名次也可能随换算制度改变
  来源: 统计分析通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-credit-accounting-caliber
  标题: 学分统计是否含重修与免修
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 学分
  - 已获学分
  - 总学分
  - credit
  - credits
  触发条件: 统计学生已获学分或专业总学分
  规则内容: |-
    「已获学分」有三种口径：按修读课程累加（重修会重复计）、按通过的课程计（不及格不计、重修只计一次）、以及计入免修与学分认定（转专业、交换、证书抵免）。三种口径在有无重修、有无免修的学生身上会得出不同数字。判定线索是「已获学分」与按课程明细累加的结果对不上。核对时应拿明细重算一遍，确认当前列用的是哪种口径，并把口径写进说明；特别是毕业审核这类场景，必须与教务口径一致，不能自行按明细重算。
  正例: 以教务口径为准，并用课程明细重算一次核对差异来源
  反例: |-
    即使没有重修与免修，也需检查不及格、替代课程、跨校认定及统计范围，不能保证所有口径一致
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-enrollment-base-caliber
  标题: 在校生数的时点与分母口径
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 在校生数
  - 招生数
  - 毕业生数
  - 学年初
  - 统计时点
  触发条件: 统计在校生数、招生数、毕业生数等规模类指标
  规则内容: |-
    规模类指标的差异主要来自两点：时点与分母。时点上，有「学年初」与「学年末」两种，休学、复学、转入转出发生在学年中途，不同时点取数结果不同，且统计口径要求各异：有口径要求休学学生仍计入在校生，有的要求剔除。分母上，生均经费、师生比这类指标的「生」是按自然人数还是按当量学生数（折算）算，结果差别很大。判定线索是同一指标在两份报表里对不上，而这种差异恰好能用时点或口径差异解释。引用外部数据时必须同时记录时点与分母定义，否则数字无法复核。
  正例: 写明「学年初、自然人数、含休学」，使指标可被复现与对比
  反例: |-
    同校同一时点同一口径也可能因补录、状态更新或提取错误产生差异，仍需核对版本与明细
  来源: 教育统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-grade-curve-rounding
  标题: 成绩核算的进位与截断口径
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 成绩
  - 平均分
  - 总评成绩
  - 最终成绩
  - score
  触发条件: 对多项成绩加权汇总后需要取整或保留固定位数
  规则内容: |-
    成绩合成要确认权重、纳入课程、舍入方式与舍入时机。“四舍五入”“截断”和银行家舍入等并不相同，不能用某语言默认round替代教务规则。先按规定精度计算，再在规定环节舍入，并核对临界例题；本条不提供通用及格或换算制度。
  正例: 全程保留算术精度，仅在输出最终成绩时按教务规则取整
  反例: 若成绩本身以整数录入且不再做加权计算，不存在进位问题
  来源: |-
    Python 官方文档：decimal（十进制精度与舍入）
    https://docs.python.org/3/library/decimal.html
    核对日期：2026-10-25
  权威度: 行业
  核验状态: 待核对
- id: ds-group-aware-evaluation-split
  标题: 同一主体的重复记录需按评估目标划分
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 主体ID
  - 试样ID
  - group
  - subject_id
  触发条件: 同一人、设备或试样有多行，并进入训练与测试两侧
  规则内容: |-
    若目标是泛化到新主体，划分时应使主体组在两侧不重叠，必要时核对家庭、批次等更高层级。若目标是预测已知主体未来，则需另设时间边界。分层平衡类别不能替代主体隔离，也不能仅去除完全相同行就认为无泄漏。
  正例: 评估新试样泛化时，某试样全部重复测量放在同一折
  反例: 已知用户的未来预测可能允许同用户历史，但不能使用其未来结果
  来源: |-
    scikit-learn 官方文档：GroupKFold
    https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.GroupKFold.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: ds-time-ordered-evaluation-split
  标题: 时序评估需保证训练早于测试
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 时间
  - 训练期
  - 测试期
  - event_time
  触发条件: 预测有时间顺序的数据，却随机打散后评估
  规则内容: |-
    面向未来的预测应按时序构造训练和测试窗口，明确间隔及标签观察期，避免训练使用测试时期信息。按行数切窗前检查采样间隔；不等间隔或不同主体的时间序列需按实际时长与分组设计评估。
  正例: 使用历史期训练、之后的期间测试，并记录窗口长度与间隔
  反例: |-
    并非所有独立同分布任务都必须时序切分；不等间隔数据也不能仅按相同行数认定窗口可比
  来源: |-
    scikit-learn 官方文档：TimeSeriesSplit
    https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: ds-imbalanced-class-metric
  标题: 类别不平衡时准确率可能掩盖失败
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 标签
  - 预测类别
  - y_true
  - y_pred
  触发条件: 某类占比很低，但模型只展示整体准确率
  规则内容: |-
    先明确正类与业务代价，再同时查看混淆矩阵、各类召回/精确率及合适的综合指标，并与简单基线比较。缺少某类或指标分母为0时应报告不可估计，不静默写0或1；重采样和阈值选择只在训练流程内进行。
  正例: 1000条中10条正类，全预测负类准确率99%，但正类召回为0
  反例: 高准确率本身既不证明好也不证明坏；真实部署类别比例变化时还需重新评估
  来源: |-
    scikit-learn 官方文档：Metrics and scoring，平衡准确率与分类指标
    https://scikit-learn.org/stable/modules/model_evaluation.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: ds-random-seed-environment
  标题: 固定随机种子不保证跨环境完全复现
  类别: 口径规则
  适用学科: 数据科学与大数据技术
  适用字段:
  - 随机种子
  - 模型
  - 依赖版本
  - seed
  触发条件: 同一随机种子运行后结果仍不同，或准备跨设备复现实验
  规则内容: |-
    应同时记录输入版本、随机生成器及状态、依赖版本、设备和非确定性算法设置。固定种子只控制部分随机来源，不能保证跨版本、平台或CPU/GPU结果逐位一致；明确可接受容差并解释差异。
  正例: 保存种子、运行环境与确定性设置，在同条件下复核输出
  反例: 只记seed=42不等于已完整复现，也不能把微小数值差异自动认定为造假
  来源: |-
    PyTorch 官方文档：Reproducibility，跨版本/平台不确定性
    https://docs.pytorch.org/docs/2.14/notes/randomness.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
- id: ds-case-partition-key-format
  标题: 分区键格式不一致导致漏读
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 日期
  - 分区
  - partition
  - dt
  - date
  触发条件: 按分区路径读取数据时，部分日期的数据缺失或读不到，且不报错
  规则内容: |-
    分区读取需依据存储系统的分区元数据、清单或一致快照，并核对预期时间覆盖。路径格式不一致可能导致漏读，但路径一致也不能保证数据完整；直接枚举也可能受权限、延迟或并发写入影响。保留读取清单及版本，报告缺失分区。
  正例: 先列出实际分区名，再按清单读取
  反例: 分区名格式统一不代表按模板拼路径一定可靠，还需验证分区存在、权限及读取快照
  来源: 大数据工程实践的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-row-order-not-guaranteed
  标题: 分布式处理的输出顺序不保证
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段: []
  触发条件: 后续步骤依赖查询结果的返回顺序，或按行号与其他数据对齐
  规则内容: |-
    输出顺序是否稳定取决于数据源和操作，不能用单机/单线程作保证。按位置对齐前应建立稳定且唯一的观测键；显式排序还需处理并列次级键。跨表优先按正确键连接，保留无法唯一对齐的记录。
  正例: 显式按稳定键排序，或用键连接而不是按位置对齐
  反例: 单机处理中集合、数据库查询或无次级键排序也可能无稳定顺序，不能自动按位置对齐
  来源: 大数据工程实践的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-convenience-sampling
  标题: 便利抽样造成的选择偏差
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段: []
  触发条件: 数据来自线上日志或自愿填报，而结论要推广到全体
  规则内容: |-
    线上行为数据只覆盖使用该渠道的人群，自愿填报名单只覆盖愿意参与的人，这类样本与目标总体在结构上不同，直接算出的比例不能代表总体。判定线索是进入样本的机制本身与所研究的特征相关。应报告样本来源并明确适用范围。
  正例: 报告「本结论适用于该渠道活跃用户」，不推广到全体
  反例: 随机抽号也需检查抽样框覆盖、无应答和权重，不能仅凭随机二字保证代表总体
  来源: 抽样调查的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-case-log-timezone
  标题: 日志时间戳的时区不统一
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 时间
  - 时间戳
  - 创建时间
  - updated_at
  - timestamp
  触发条件: 同一张表里不同来源的时间相差整数小时，偏移量恒定
  规则内容: |-
    日志时间需区分本地墙上时间、时区偏移与真实时刻。转换前查来源时区和夏令时规则，保留原值与时区；没有时区信息不能凭整数小时差猜测。即使来自同一服务，配置变化、夏令时或设备时钟也可能造成问题。
  正例: 来源时区已确认后转换到统一时区，再检查事件先后
  反例: 同一服务不保证所有记录时区一致；不能直接把无时区本地时间当UTC
  来源: |-
    pandas 官方文档：to_datetime（明确格式、精度、时区）
    https://pandas.pydata.org/docs/reference/api/pandas.to_datetime.html
    核对日期：2026-10-25
  权威度: 行业
  核验状态: 待核对
- id: ds-case-nested-null-forms
  标题: 嵌套结构里的空值形态不一
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段: []
  触发条件: 从 JSON 或日志解析出的字段里，空值有多种表现
  规则内容: |-
    嵌套数据里的缺失可能是字段不存在、值为空、空字符串、空数组，或者字面量字符串「null」与「None」。它们在解析后看似都是空，但语义不同，判空逻辑写错会把「确实为空」与「没这个字段」混为一谈。判定线索是该字段的出现频率低于总行数。
  正例: 区分「字段不存在」与「值为空」两种情况
  反例: |-
    扁平表也可能同时出现空字符串、NULL、NA、未知和不适用，不能说缺失只有空白一种
  来源: 半结构化数据处理的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-upstream-schema-change
  标题: 上游改结构导致下游静默错位
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段: []
  触发条件: 例行任务某天的结果突然异常，而下游代码未改动
  规则内容: |-
    上游变化不仅包括列的位置，还包括同名字段的类型、单位和含义。按列名读取能减少位置错位，但不能检测所有语义变化。需保存并比较字段契约，检查新增、缺失、重名、类型与单位，并明确版本迁移及异常处理。
  正例: 按列名取数，缺列时显式报错
  反例: 即使列名和列序未变，单位从元改为万元仍会静默改变含义
  来源: 数据管道的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-course-code-revision
  标题: 课程号跨年改版导致同名不同号
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 课程号
  - 课程代码
  - course_id
  - 课程编号
  - 课程名称
  触发条件: 同一门课程在不同学年出现不同课程号，或同一课程号对应了不同课程名
  规则内容: |-
    培养方案修订时课程会换号：课程内容不变但代码升级，或者两门课合并成一条新代码，或者同一代码在新方案里换了名称与学时。表现是按课程号逐年统计时，某门课在改版那年「消失」又「新增」，而按课程名统计时又出现同名不同号被拆成两门。判定线索是课程号或课程名的对应关系（一对多）在不同学年不一致。跨年比较前应维护一份课程映射表，明确改版前后的对应关系，再按映射后的稳定键统计；直接按课程号做多年趋势会得出课程被取消又重新开设的假象。
  正例: 建课程映射表把改版前代码归并到稳定键，再统计多年选课人数
  反例: 单个学年也可能有跨系统或培养方案并行，仍需检查课程号的唯一性和版本
  来源: 数据管道的常见问题
  权威度: 行业
  核验状态: 待核对
- id: ds-case-instrument-range
  标题: 实验数据超出仪器量程的取值
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 测量值
  - 读数
  - 量程
  - measurement
  - 仪器
  - 值
  触发条件: 实验测量列出现超出该仪器量程的取值，或所有测量值整齐地等于上下限
  规则内容: |-
    边界堆积可提示饱和、量程截断或检出限问题，也可能是真实值或舍入。需查设备手册、校准、状态码和实验记录，保留小于/大于限值等标志。只有证据表明测量无效才标无效；删失观测不等同于缺失，不能机械删除或置空。
  正例: 设备日志确认超上限 → 保留“>上限”及限值，按研究方案处理删失
  反例: 测量在量程中段不能完全排除检出限、校准或其他测量问题
  来源: 测量学与统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-case-repeat-measurement-id
  标题: 重复测量的编号与批次丢失
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 测量编号
  - 重复序号
  - 批次
  - run_id
  - sample_id
  - 样本编号
  触发条件: 同一试样有多次重复测量，但表中缺少区分重复次与试样的标识
  规则内容: |-
    重复或层级观测需标明试样/受试者、重复序号、时间与批次，区分技术重复和独立实验单位。把相关重复当独立样本会夸大有效样本量并可能低估推断不确定性；不能笼统说一定低估“测量误差”。缺少标识时先追溯记录，不猜测分组。
  正例: 补齐试样编号、重复序号、批次三层标识，再区分组内与组间变异
  反例: 每个试样一次测量也可能存在批次或其他聚类，不能据此保证观测独立
  来源: 测量学与统计的通用口径
  权威度: 行业
  核验状态: 待核对
- id: ds-case-lab-timestamp-batch
  标题: 实验记录时间与批次字段不一致
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 实验时间
  - 记录时间
  - 批次
  - batch
  - 上机时间
  - 采样时间
  触发条件: 实验记录的时间与批次编号对不上，或同一批次跨越不合理的时间跨度
  规则内容: |-
    时间、批次与上机顺序的关系应依据实验流程定义，不要求所有批次天然时间单调。先区分采样、测量、导出与补录时间，保留设备时钟/时区和批次来源；按有效日志核对异常，不凭跨度直接更改批次。
  正例: 确认字段是测量时间后，对照设备日志与批次安排核对
  反例: 同系统同时生成不保证字段正确；正常批次也可能跨天或并行，需流程依据
  来源: 数据处理留痕的通用要求
  权威度: 行业
  核验状态: 待核对
- id: ds-preprocess-before-split-leakage
  标题: 划分前拟合填补或标准化会泄漏信息
  类别: 清洗案例
  适用学科: 数据科学与大数据技术
  适用字段:
  - 特征
  - 训练集
  - 测试集
  - feature
  触发条件: 用全数据计算填补值、缩放参数或选特征后再划分训练测试集
  规则内容: |-
    需要从数据学习的处理参数应只在训练部分拟合；交叉验证时还需在各训练折内拟合，再应用到验证部分。固定且不依赖样本统计的格式转换可先执行。保留划分与处理参数，不能把测试集反馈用于选择清洗方案。
  正例: 在每个训练折拟合填补器和缩放器，再变换该折验证数据
  反例: 按已声明单位把所有g换成kg通常不涉及拟合，不能把一切划分前转换都叫泄漏
  来源: |-
    scikit-learn 官方文档：Common pitfalls，第12.2节，数据泄漏
    https://scikit-learn.org/stable/common_pitfalls.html
    资料查阅日期：2026-10-25
  权威度: 行业
  核验状态: 已核对
